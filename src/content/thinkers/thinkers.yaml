  name: Joseph B. Soloveitchik
  worldview: judaism
  role: primary
  schools: [Modern Orthodox Judaism]
  birthYear: 1903
  deathYear: 1993
  description: Talmudist and philosopher who gave modern Orthodoxy a religious anthropology and an account of halakhic life.
  representativeWorks:
    - { title: Halakhic Man, sourceId: soloveitchik-halakhic-man }
