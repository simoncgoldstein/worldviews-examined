# Thinker registry: a research map, not a claim that any figure represents every adherent
# of a worldview, or that thinkers within one lane agree. `worldview` is a worldview ID.
#
# role:
#   primary       a major thinker regularly used to represent a significant strand of the worldview
#   specialist    used mainly for particular subjects (see `usedFor`)
#   interlocutor  important to the comparison but NOT presented as a representative of the lane
# Lanes need not have the same number of primary thinkers.
# Dates are given only where reasonably settled; otherwise `era` carries a looser dating.

# --- Reformed Christianity ---------------------------------------------------------------
- id: calvin
  slug: john-calvin
  name: John Calvin
  worldview: christianity
  role: primary
  displayOrder: 2
  schools: [Reformed theology]
  birthYear: 1509
  deathYear: 1564
  description: Reformer of Geneva whose Institutes of the Christian Religion shaped Reformed doctrine, notably on the knowledge of God, the image of God, the fall and providence.
  bio: >-
    John Calvin (1509–1564) was born at Noyon in Picardy and studied in Paris and then law at
    Orléans, before committing himself to the Protestant Reformation in the early
    1530s. The first edition of his Institutes of the Christian Religion appeared at Basel in 1536.
    He ministered in Geneva from 1536 until his expulsion in 1538, spent three years in
    Strasbourg, and returned to Geneva in 1541, where he remained as pastor, preacher, teacher and
    commentator until his death. He revised the Institutes repeatedly; the definitive Latin
    edition of 1559 became the most influential systematic statement of Reformed doctrine.
  significance: >-
    Calvin supplies the classic Reformed account of humanity as a ruined image: created excellence,
    corrupted natural gifts, withdrawn supernatural gifts, and a restraint of sin that leaves room
    for real human achievement. His treatment in Institutes II.1–3 is a principal source for the
    Christian answer to why people are both great and terrible.
  keyIdeas:
    - Knowledge of God and of ourselves
    - Image of God as marred but not destroyed
    - Natural gifts corrupted, supernatural gifts lost
    - God's restraint of sin and the gifts of the Spirit to unbelievers
    - Necessity without compulsion
  representativeWorks:
    - { title: Institutes of the Christian Religion, year: 1559, sourceId: calvin-institutes-beveridge }
    - { title: Commentary on Romans, year: 1540, sourceId: calvin-commentary-romans }

- id: turretin
  slug: francis-turretin
  name: Francis Turretin
  worldview: christianity
  role: primary
  displayOrder: 3
  schools: [Reformed scholasticism]
  birthYear: 1623
  deathYear: 1687
  description: Genevan theologian whose scholastic method gave Reformed doctrine its most systematic polemical statement in the seventeenth century.
  bio: >-
    Francis Turretin (1623–1687) was born in Geneva into a family of Italian Protestant refugees
    from Lucca; his father, Benedict Turretin, was a pastor and professor of theology there. After
    studying in Geneva and at several Dutch and French academies, he became pastor of Geneva's
    Italian congregation in 1648 and professor of theology at the Genevan Academy in 1653, a post he
    held until his death. His Institutio theologiae elencticae (1679–1685) sets out Reformed
    doctrine as a series of disputed questions, each answered against Roman Catholic, Lutheran,
    Socinian and Remonstrant positions. It became a standard textbook of Reformed orthodoxy and was
    still used at Princeton Theological Seminary in the nineteenth century.
  significance: >-
    Turretin gives precise scholastic definitions of doctrines that Scripture states and the
    confessions summarize. He is used here mainly for the image of God, distinguishing the image
    retained after the Fall from the original righteousness that was lost, and for the line he
    draws between lawful art and images in worship.
  keyIdeas:
    - Elenctic (disputational) method
    - Image of God in nature, uprightness and dominion
    - Image partly retained after the Fall
    - Art lawful; images of God in worship forbidden
  representativeWorks:
    - { title: Institutio theologiae elencticae, year: 1679, sourceId: turretin-institutio-1847 }
    - { title: Institutes of Elenctic Theology, sourceId: turretin-institutes }

- id: bavinck
  slug: herman-bavinck
  name: Herman Bavinck
  worldview: christianity
  role: primary
  displayOrder: 5
  schools: [Dutch Reformed theology]
  birthYear: 1854
  deathYear: 1921
  description: Dutch Reformed theologian who treated revelation, religion, anthropology and modernity within a single dogmatic system.
  bio: >-
    Herman Bavinck (1854–1921) was born at Hoogeveen in the Netherlands. He studied at Kampen and
    then at Leiden, completing a doctorate on the ethics of Zwingli in 1880. From 1902 he was a
    professor at the Free University of Amsterdam. His four-volume Gereformeerde Dogmatiek (1895–1901)
    is the major systematic work of Dutch neo-Calvinism, and he also wrote on ethics, education and
    psychology and took part in Dutch public life, serving in the Senate from 1911. He delivered the
    Stone Lectures at Princeton in 1908.
  significance: >-
    Bavinck interprets Calvin's doctrine of common grace as the Reformed explanation of how human
    culture, arts and sciences flourish outside the church despite the fall. He is used mainly for
    this account of the gifts and restraint that coexist with sin, not as a spokesman for the whole
    tradition.
  keyIdeas:
    - Grace restores nature
    - Common grace restrains sin and preserves creation
    - Arts and sciences as gifts of the Spirit
    - Remnants of the image of God in human gifts
    - Organic unity in diversity
  representativeWorks:
    - { title: Reformed Dogmatics (Gereformeerde Dogmatiek), year: 1895, sourceId: bavinck-reformed-dogmatics }
    - { title: Calvin and Common Grace, year: 1909, sourceId: bavinck-calvin-common-grace }
  notes: Reformed Dogmatics appeared in Dutch in four volumes, 1895–1901 (English translation 2003–2008); the year field gives the first volume. His start date at Kampen is disputed (1881 or 1883) and is omitted.

