- id: augustine
  slug: augustine-of-hippo
  name: Augustine of Hippo
  worldview: christianity
  role: primary
  displayOrder: 1
  schools: [Patristic theology, Augustinian tradition]
  birthYear: 354
  deathYear: 430
  description: North African bishop and theologian whose work on will, grace, evil, the two cities and history is foundational to Reformed anthropology and soteriology.
  bio: >-
    Augustine (354–430) was born at Thagaste in Roman North Africa. Trained in rhetoric, he
    taught in Carthage, Rome and Milan and passed through Manichaeism and Neoplatonism before
    turning to Christianity in 386; he was baptised by Ambrose at Easter 387. He was ordained a
    priest at Hippo Regius in 391, became its bishop around 396, and served there until his death
    during the Vandal siege in 430. His Confessions examine his own will and loves before God, and
    The City of God, begun in 412, interprets history as the interplay of two loves. His
    controversies with the Manichees, Donatists and Pelagians shaped Western Latin teaching on
    evil, sin and grace.
  significance: >-
    For the question "Why is man so great and so terrible?", Augustine supplies much of the
    conceptual vocabulary the Reformed answer inherits: evil as privation, pride and disordered
    love, the divided will, and human gifts coexisting with misery. He is a primary Christian
    antecedent of the Reformed tradition, not himself a Reformed theologian.
  keyIdeas:
    - Evil as privation of good
    - Pride and disordered love
    - Two loves and two cities
    - The divided will and the chain of habit
    - Grace as remedy for a bound will
  representativeWorks:
    - { title: Confessions, year: 400, sourceId: augustine-confessions }
    - { title: The City of God, year: 426, sourceId: augustine-city-of-god }
  notes: Included as a primary Christian antecedent of the Reformed tradition, not as a Reformed theologian. Confessions is dated ca. 396–400 and The City of God 412–426; the year given is the completion date.

- id: witsius
  slug: herman-witsius
  name: Herman Witsius
  worldview: christianity
  role: primary
  displayOrder: 4
  schools: [Reformed covenant theology]
  birthYear: 1636
  deathYear: 1708
  description: Dutch Reformed theologian whose systematic treatment of the covenants shaped Reformed covenant theology.
  bio: >-
    Herman Witsius (1636–1708) was a Dutch Reformed theologian who held professorships of divinity
    at Franeker (1675), Utrecht (1680) and Leiden (1698), where he died. His chief work, De
    oeconomia foederum Dei cum hominibus (Leeuwarden, 1677; English translation as The Economy of
    the Covenants between God and Man), set out Reformed covenant theology in a systematic form.
    It was reprinted several times in the following decades and translated into English in the
    early nineteenth century. Writing amid the Voetian and Cocceian controversies in the Dutch
    church, he is generally described as having tried to mediate between the parties.
  significance: >-
    Witsius states federal headship, the imputation of Adam's first sin and the Adam–Christ parallel
    of Romans 5 in classic Reformed covenantal form. This is the confessional explanation for the
    universality of human corruption, and he is used on that point rather than as a general
    spokesman for the tradition.
  keyIdeas:
    - Covenant of works with Adam as head
    - Imputation of Adam's first sin
    - Adam as type of Christ
    - Covenant of grace
    - Mediation between Voetians and Cocceians
  representativeWorks:
    - { title: The Economy of the Covenants between God and Man, year: 1677, sourceId: witsius-economy-covenants }
  notes: Original Latin title De oeconomia foederum Dei cum hominibus; the year is that of the Latin first edition.

- id: edwards
  slug: jonathan-edwards
  name: Jonathan Edwards
  worldview: christianity
  role: specialist
  displayOrder: 1
  usedFor: [affections, will, beauty, desire, religious experience]
  schools: [New England Reformed theology]
  birthYear: 1703
  deathYear: 1758
  description: American theologian and philosopher whose analyses of the affections, the will and the beauty of God have been influential in Reformed thought.
  bio: >-
    Jonathan Edwards (1703–1758) was born at East Windsor, Connecticut, and educated at Yale,
    where he later served as a tutor. From the mid-1720s he was a minister at Northampton,
    Massachusetts, and a leading figure in the revivals of the 1730s and 1740s. Dismissed by his
    congregation in 1750, he worked as a missionary and pastor at Stockbridge until 1757, when he
    was called to the presidency of the College of New Jersey (Princeton); he died in March 1758
    after a smallpox inoculation. Working in the New England Puritan Reformed tradition, he wrote
    on religious experience, freedom of the will, original sin and virtue, combining Reformed
    theology with philosophical argument.
  significance: >-
    Edwards explains how a person can approve the good yet be morally unable to will it, and why
    natural pity, gratitude and conscience can restrain vice without amounting to true virtue.
    He is used for the moral psychology of the Reformed account, not as a general spokesman for
    the tradition.
  keyIdeas:
    - Natural versus moral inability
    - The will follows the strongest motive
    - True virtue as benevolence to being in general
    - Natural conscience distinct from true virtue
    - Religious affections
    - Original sin inferred from a universal tendency
  representativeWorks:
    - { title: A Treatise Concerning Religious Affections, year: 1746 }
    - { title: Freedom of the Will, year: 1754, sourceId: edwards-works-hickman-1 }
    - { title: Original Sin, year: 1758, sourceId: edwards-works-hickman-1 }
    - { title: The Nature of True Virtue, year: 1765, sourceId: edwards-works-hickman-1 }
  notes: The Nature of True Virtue was written in the 1750s and published posthumously in 1765. Freedom of the Will and Original Sin are the usual short titles of longer original titles.

- id: owen
  slug: john-owen
  name: John Owen
  worldview: christianity
  role: specialist
  displayOrder: 2
  usedFor: [sin, mortification, the Holy Spirit, atonement, communion with God, Christology]
  schools: [English Puritan Reformed theology]
  birthYear: 1616
  deathYear: 1683
  description: English Puritan theologian known for detailed treatments of indwelling sin, the work of the Spirit, the atonement and communion with God.
  bio: >-
    John Owen (1616–1683) was an English Puritan theologian and pastor. Educated at Queen's College,
    Oxford, he published his first book, A Display of Arminianism, in 1642, and was given the living
    of Fordham in Essex. He preached before Parliament, served as a chaplain to Oliver Cromwell, and
    was Dean of Christ Church and Vice-Chancellor of the University of Oxford in the 1650s. A leading
    Independent (Congregationalist), he took part in drafting the Savoy Declaration of 1658. After
    the Restoration he ministered to a congregation in London until his death. His writings fill
    twenty-four volumes in William Goold's nineteenth-century edition.
  significance: >-
    Owen is the classic English Reformed expositor of the atonement and of indwelling sin. He is
    used here for what Scripture means by Christ bearing sin and making satisfaction, and as the
    best-known defender of definite atonement, the particular design of Christ's death taught in the
    Canons of Dort and the Westminster Confession; his own arguments for it are attributed to him.
    He is also used for the deceitfulness of indwelling sin.
  keyIdeas:
    - Satisfaction as the bearing of sin's penalty
    - Definite (particular) atonement
    - Oblation and intercession as one priestly work
    - Indwelling sin and mortification
  representativeWorks:
    - { title: The Death of Death in the Death of Christ, year: 1647, sourceId: owen-works-goold-10 }
    - { title: Of the Mortification of Sin in Believers, year: 1656, sourceId: owen-works-goold-6 }
    - { title: Communion with God, year: 1657 }

