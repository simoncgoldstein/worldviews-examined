# Thinker registry: a research map, not a claim that any figure represents every adherent
# of a worldview, or that thinkers within one lane agree. `worldview` is a worldview ID.
#
# role:
#   primary       a major thinker regularly used to represent a significant strand of the worldview
#   specialist    used mainly for particular subjects (see `usedFor`)
#   interlocutor  important to the comparison but NOT presented as a representative of the lane
# Lanes need not have the same number of primary thinkers.
# Dates are given only where reasonably settled; otherwise `era` carries a looser dating.

# --- Reformed Christianity ---------------------------------------------------------------
- id: calvin
  slug: john-calvin
  name: John Calvin
  worldview: christianity
  role: primary
  schools: [Reformed theology]
  birthYear: 1509
  deathYear: 1564
  description: Reformer of Geneva whose Institutes of the Christian Religion shaped Reformed doctrine, notably on the knowledge of God, the image of God, the fall and providence.
  representativeWorks:
    - { title: Institutes of the Christian Religion, year: 1559, sourceId: calvin-institutes }

- id: turretin
  slug: francis-turretin
  name: Francis Turretin
  worldview: christianity
  role: primary
  schools: [Reformed scholasticism]
  birthYear: 1623
  deathYear: 1687
  description: Genevan theologian whose scholastic method gave Reformed doctrine its most systematic polemical statement in the seventeenth century.
  representativeWorks:
    - { title: Institutes of Elenctic Theology, sourceId: turretin-institutes }

- id: bavinck
  slug: herman-bavinck
  name: Herman Bavinck
  worldview: christianity
  role: primary
  schools: [Dutch Reformed theology]
  birthYear: 1854
  deathYear: 1921
  description: Dutch Reformed theologian who treated revelation, religion, anthropology and modernity within a single dogmatic system.
  representativeWorks:
    - { title: Reformed Dogmatics, sourceId: bavinck-reformed-dogmatics }

- id: vos
  slug: geerhardus-vos
  name: Geerhardus Vos
  worldview: christianity
  role: primary
  schools: [Reformed biblical theology]
  birthYear: 1862
  deathYear: 1949
  description: Reformed theologian and a founder of biblical theology as the study of the progress of God's self-disclosure in history.
  representativeWorks:
    - { title: "Biblical Theology: Old and New Testaments", year: 1948, sourceId: vos-biblical-theology }

- id: van-til
  slug: cornelius-van-til
  name: Cornelius Van Til
  worldview: christianity
  role: primary
  schools: [Presuppositional apologetics]
  birthYear: 1895
  deathYear: 1987
  description: Reformed apologist who developed the Creator-creature distinction, analogical knowledge and the transcendental method into a distinctive apologetic.
  representativeWorks:
    - { title: The Defense of the Faith, year: 1955, sourceId: van-til-defense }

- id: bahnsen
  slug: greg-bahnsen
  name: Greg L. Bahnsen
  worldview: christianity
  role: primary
  schools: [Presuppositional apologetics]
  birthYear: 1948
  deathYear: 1995
  description: Reformed apologist and ethicist who presented the transcendental argument and internal critique in accessible form.
  representativeWorks:
    - { title: "Van Til's Apologetic: Readings and Analysis", year: 1998, sourceId: bahnsen-van-til-apologetic }

- id: augustine
  slug: augustine-of-hippo
  name: Augustine of Hippo
  worldview: christianity
  role: primary
  schools: [Patristic theology, Augustinian tradition]
  birthYear: 354
  deathYear: 430
  description: North African bishop and theologian whose work on will, grace, evil, the two cities and history is foundational to Reformed anthropology and soteriology.
  representativeWorks:
    - { title: Confessions }
    - { title: The City of God }
  notes: Included as a primary Christian antecedent of the Reformed tradition, not as a Reformed theologian.

- id: witsius
  slug: herman-witsius
  name: Herman Witsius
  worldview: christianity
  role: primary
  schools: [Reformed covenant theology]
  birthYear: 1636
  deathYear: 1708
  description: Dutch Reformed theologian whose systematic treatment of the covenants shaped Reformed covenant theology.
  representativeWorks:
    - { title: The Economy of the Covenants between God and Man }

- id: edwards
  slug: jonathan-edwards
  name: Jonathan Edwards
  worldview: christianity
  role: specialist
  usedFor: [affections, will, beauty, desire, religious experience]
  schools: [New England Reformed theology]
  birthYear: 1703
  deathYear: 1758
  description: American theologian and philosopher whose analyses of the affections, the will and the beauty of God have been influential in Reformed thought.
  representativeWorks:
    - { title: A Treatise Concerning Religious Affections, year: 1746 }
    - { title: Freedom of the Will, year: 1754 }
    - { title: The Nature of True Virtue }

- id: owen
  slug: john-owen
  name: John Owen
  worldview: christianity
  role: specialist
  usedFor: [sin, mortification, the Holy Spirit, atonement, communion with God, Christology]
  schools: [English Puritan Reformed theology]
  birthYear: 1616
  deathYear: 1683
  description: English Puritan theologian known for detailed treatments of indwelling sin, the work of the Spirit, the atonement and communion with God.
  representativeWorks:
    - { title: The Death of Death in the Death of Christ, year: 1647 }
    - { title: Of the Mortification of Sin in Believers, year: 1656 }
    - { title: Communion with God, year: 1657 }

- id: aquinas
  slug: thomas-aquinas
  name: Thomas Aquinas
  worldview: christianity
  role: interlocutor
  schools: [Scholasticism, Thomism]
  birthYear: 1225
  deathYear: 1274
  description: Medieval theologian and philosopher whose synthesis of Christian doctrine and Aristotelian philosophy is a major point of reference in Christian thought.
  representativeWorks:
    - { title: Summa Theologiae }
    - { title: Summa contra Gentiles }
  notes: Not a representative of this site's Reformed apologetic method. His approach to natural theology and to the relation of reason and revelation is distinct from Van Tilian presuppositional method and should be presented as that of a Christian interlocutor.

- id: athanasius
  slug: athanasius-of-alexandria
  name: Athanasius of Alexandria
  worldview: christianity
  role: interlocutor
  schools: [Patristic theology, Nicene orthodoxy]
  era: c. 296–373
  description: Bishop of Alexandria and chief defender of Nicene Trinitarian and Christological orthodoxy.
  representativeWorks:
    - { title: On the Incarnation }
  notes: A Christian interlocutor, not a representative of the site's specifically Reformed apologetic method.

- id: anselm
  slug: anselm-of-canterbury
  name: Anselm of Canterbury
  worldview: christianity
  role: interlocutor
  schools: [Scholasticism]
  birthYear: 1033
  deathYear: 1109
  description: Archbishop and theologian known for the ontological argument and for a satisfaction account of the atonement.
  representativeWorks:
    - { title: Proslogion }
    - { title: Cur Deus Homo }
  notes: A Christian interlocutor, not a representative of the site's specifically Reformed apologetic method.

# --- Naturalistic atheism ----------------------------------------------------------------
- id: hume
  slug: david-hume
  name: David Hume
  worldview: naturalism
  role: primary
  schools: [Empiricism, Scottish Enlightenment]
  birthYear: 1711
  deathYear: 1776
  description: Scottish philosopher and a major historical critic of natural theology, causation and induction.
  representativeWorks:
    - { title: A Treatise of Human Nature, year: 1739 }
    - { title: An Enquiry Concerning Human Understanding, year: 1748, sourceId: hume-enquiry }
    - { title: Dialogues Concerning Natural Religion, year: 1779 }
  notes: Hume was not an atheist in a simple sense; he is included as a historical critic of natural theology.

- id: russell
  slug: bertrand-russell
  name: Bertrand Russell
  worldview: naturalism
  role: primary
  schools: [Analytic philosophy]
  birthYear: 1872
  deathYear: 1970
  description: British philosopher and logician who argued against religious belief on philosophical and moral grounds.
  representativeWorks:
    - { title: The Problems of Philosophy, year: 1912 }
    - { title: Why I Am Not a Christian, year: 1927 }

- id: mackie
  slug: j-l-mackie
  name: J. L. Mackie
  worldview: naturalism
  role: primary
  schools: [Analytic philosophy, Moral error theory]
  birthYear: 1917
  deathYear: 1981
  description: Australian philosopher known for the logical argument from evil and for his error theory of morality.
  representativeWorks:
    - { title: "Ethics: Inventing Right and Wrong", year: 1977 }
    - { title: The Miracle of Theism, year: 1982 }
  notes: Mackie's moral error theory is not shared by all naturalists.

- id: dennett
  slug: daniel-dennett
  name: Daniel Dennett
  worldview: naturalism
  role: primary
  schools: [Philosophy of mind, Evolutionary naturalism]
  birthYear: 1942
  deathYear: 2024
  description: American philosopher who defended a naturalistic account of mind, consciousness and religion.
  representativeWorks:
    - { title: Consciousness Explained, year: 1991 }
    - { title: "Breaking the Spell: Religion as a Natural Phenomenon", year: 2006 }

- id: oppy
  slug: graham-oppy
  name: Graham Oppy
  worldview: naturalism
  role: primary
  schools: [Analytic philosophy of religion]
  description: Australian philosopher who has defended naturalism through detailed engagement with arguments for and against theism.
  representativeWorks:
    - { title: Arguing About Gods, year: 2006 }

- id: railton
  slug: peter-railton
  name: Peter Railton
  worldview: naturalism
  role: specialist
  usedFor: [ethics, naturalistic moral realism]
  schools: [Naturalistic moral realism]
  description: American philosopher associated with a naturalistic moral realism on which objective moral facts are part of the natural world.
  representativeWorks:
    - { title: "Facts, Values, and Norms", year: 2003 }

- id: rosenberg
  slug: alex-rosenberg
  name: Alex Rosenberg
  worldview: naturalism
  role: specialist
  usedFor: [reductive naturalism, meaning and morality, philosophy of mind]
  schools: [Reductive naturalism]
  description: American philosopher who defends a rigorous, reductive scientific naturalism, including its consequences for meaning and morality.
  representativeWorks:
    - { title: "The Atheist's Guide to Reality", year: 2011 }
  notes: Represents one demanding form of naturalism, not naturalism as a whole.

- id: quine
  slug: w-v-o-quine
  name: W. V. O. Quine
  worldview: naturalism
  role: specialist
  usedFor: [naturalized epistemology, ontology, philosophy of language]
  schools: [Analytic philosophy, Naturalized epistemology]
  birthYear: 1908
  deathYear: 2000
  description: American philosopher whose naturalized epistemology treats knowledge as part of empirical inquiry rather than as grounded in a prior first philosophy.
  representativeWorks:
    - { title: Word and Object, year: 1960 }
    - { title: Epistemology Naturalized, year: 1969 }
  notes: Used for epistemology and ontology. Quine did not write on religion in a way that represents naturalistic atheism generally.

# --- Rabbinic Judaism --------------------------------------------------------------------
