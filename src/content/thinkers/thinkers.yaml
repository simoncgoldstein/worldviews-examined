- id: van-til
  slug: cornelius-van-til
  name: Cornelius Van Til
  worldview: christianity
  role: primary
  displayOrder: 7
  schools: [Presuppositional apologetics]
  birthYear: 1895
  deathYear: 1987
  description: Reformed apologist who developed the Creator-creature distinction, analogical knowledge and the transcendental method into a distinctive apologetic.
  bio: >-
    Cornelius Van Til (1895–1987) was born at Grootegast in the Netherlands and emigrated with his
    family to the United States as a boy, settling at Highland, Indiana. After studying at Calvin
    College (graduating 1922) and Princeton Theological Seminary, he took a doctorate in
    philosophy at Princeton University in 1927. From 1929 until his retirement in 1972 he taught
    apologetics at Westminster Theological Seminary near Philadelphia, where he was a member of
    the original faculty, and he continued to teach part-time into 1979. Working within the
    Reformed tradition and drawing on Kuyper, Bavinck and others, he developed an apologetic
    grounded in the Creator-creature distinction, and became the best-known proponent of what
    came to be called presuppositional apologetics.
  significance: >-
    Van Til matters to this site for the Creator-creature distinction, analogical knowledge,
    antithesis, transcendental apologetics and the denial of religious neutrality. He supplies the
    method by which Reformed answers are argued against rival worldviews, rather than evidence on
    the question of human greatness and misery itself.
  keyIdeas:
    - Creator-creature distinction
    - Analogical knowledge
    - Antithesis
    - Transcendental argument
    - No brute facts
    - Denial of religious neutrality
  representativeWorks:
    - { title: The Defense of the Faith, year: 1955, sourceId: van-til-defense }

