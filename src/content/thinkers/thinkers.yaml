- id: railton
  slug: peter-railton
  name: Peter Railton
  worldview: naturalism
  role: specialist
  displayOrder: 1
  usedFor: [ethics, naturalistic moral realism]
  schools: [Naturalistic moral realism]
  description: American philosopher associated with a naturalistic moral realism on which objective moral facts are part of the natural world.
  bio: >-
    Peter Railton is an American philosopher, Gregory S. Kavka Distinguished University Professor and
    John Stephenson Perrin Professor of Philosophy Emeritus at the University of Michigan. Working in
    ethics, philosophy of mind, philosophy of science and political philosophy, he is a leading
    defender of naturalistic moral realism, the view that moral facts are natural facts that can be
    investigated and learned about. His best-known paper, "Moral Realism", appeared in the
    Philosophical Review in 1986, and his papers on ethics were collected in Facts, Values, and Norms
    (2003). He later co-authored Homo Prospectus (2016) and is a member of the American Academy of
    Arts and Sciences.
  significance: >-
    Railton shows that a naturalist can hold that cruelty and exclusion are objectively wrong and that
    moral learning tracks real facts, giving a naturalist account of both moral progress and moral
    failure. He is used for ethics, as a contrast with error theory, not as representative of all
    naturalists.
  keyIdeas:
    - Naturalistic moral realism
    - Good as idealized interests
    - Moral rightness as social rationality
    - Feedback between wants and interests
    - Moral progress without guarantee
  representativeWorks:
    - { title: Moral Realism, year: 1986, sourceId: railton-moral-realism }
    - { title: "Facts, Values, and Norms", year: 2003 }
  notes: Birth year and Princeton PhD details removed as unverified (Michigan page returned 403); titles from Oxford Uehiro bio.

