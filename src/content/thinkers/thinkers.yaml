  worldview: islam
  role: specialist
  usedFor: [mystical theology, Sufi metaphysics]
  schools: [Sufism]
  birthYear: 1165
  deathYear: 1240
  description: Andalusian mystic and author of an influential Sufi metaphysics of divine self-disclosure.
  representativeWorks:
    - { title: Fusus al-Hikam }
    - { title: al-Futuhat al-Makkiyya }
  notes: Used for mystical theology. His views are contested within mainstream Sunni thought and should not be treated as the default Islamic account.

# --- Hindu traditions --------------------------------------------------------------------
- id: shankara
  slug: shankara
  name: Shankara
  worldview: hinduism
  role: primary
  schools: [Advaita Vedanta]
  era: 8th century CE (dates debated)
  description: Commentator on the Upanishads, Bhagavad Gita and Brahma Sutras and the foundational figure of Advaita Vedanta.
  representativeWorks:
    - { title: Brahma-sutra-bhashya }
  notes: Advaita is one Hindu school and must not stand for Hindu traditions as a whole.

- id: ramanuja
  slug: ramanuja
  name: Ramanuja
  worldview: hinduism
  role: primary
  schools: [Vishishtadvaita Vedanta, Sri Vaishnavism]
  era: 11th–12th century CE
  description: Vedanta theologian who argued that the world and souls are real modes of a personal Brahman, joining philosophy to devotion.
  representativeWorks:
    - { title: Sri Bhashya }

- id: madhva
  slug: madhva
  name: Madhva
  worldview: hinduism
  role: primary
  schools: [Dvaita Vedanta]
  era: 13th century CE
  description: Vedanta theologian who taught an irreducible difference between God, souls and matter.
  representativeWorks:
    - { title: Brahma-sutra-bhashya }

- id: udayana
  slug: udayana
  name: Udayana
  worldview: hinduism
  role: primary
  schools: [Nyaya]
  era: late 10th century CE
  description: Nyaya philosopher who developed the realist natural-theological tradition, arguing for God as creator and answering Buddhist critics.
  representativeWorks:
    - { title: Nyayakusumanjali }
  notes: Represents the Nyaya realist and natural-theological strand, widening Hindu representation beyond Vedanta.

- id: kumarila
  slug: kumarila-bhatta
  name: Kumarila Bhatta
  worldview: hinduism
  role: primary
  schools: [Mimamsa]
  era: c. 7th century CE
  description: Mimamsa philosopher who defended the authority of the Veda and developed theories of language and knowledge.
  representativeWorks:
    - { title: Slokavarttika }
    - { title: Tantravarttika }
  notes: Represents Mimamsa, particularly Vedic authority, language and epistemology.

- id: abhinavagupta
  slug: abhinavagupta
  name: Abhinavagupta
  worldview: hinduism
  role: specialist
  usedFor: [nondual Shaiva philosophy, aesthetics, consciousness]
  schools: [Kashmir Shaivism]
  era: c. 10th–11th century CE
  description: Kashmir Shaiva philosopher and aesthetic theorist who set out a nondual philosophy of consciousness and a theory of aesthetic experience.
  representativeWorks:
    - { title: Tantraloka }

