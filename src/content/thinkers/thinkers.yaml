- id: darwin
  slug: charles-darwin
  name: Charles Darwin
  worldview: naturalism
  role: specialist
  displayOrder: 4
  usedFor: [evolutionary origins of the moral sense, human nature]
  schools: [Evolutionary biology]
  birthYear: 1809
  deathYear: 1882
  description: English naturalist whose theory of evolution by natural selection, applied to humans in The Descent of Man, offers an account of the origin of the moral sense.
  bio: >-
    Charles Darwin (1809–1882) was born at Shrewsbury, England. He studied medicine at Edinburgh
    and then took a Cambridge degree at Christ's College, and from 1831 spent nearly five years as
    naturalist on HMS Beagle. He later lived at Down House in Kent. On the Origin of Species
    (1859) set out the theory of evolution by natural selection; The Descent of Man (1871)
    applied it to humans, treating mind, language and the moral sense as products of descent with
    modification, and The Expression of the Emotions in Man and Animals followed in 1872. He died at
    Downe and was buried in Westminster Abbey.
  significance: >-
    Darwin gives the founding evolutionary account of the moral sense as arising from social
    instincts joined to intellect, and so of how the same animal nature can produce both sympathy and
    cruelty. He is used for evolutionary anthropology, as the source of the explanation later
    naturalists build on.
  keyIdeas:
    - Moral sense from social instincts plus intellect
    - Conscience as backward-looking remorse
    - Sympathy limited to one's own group but extendable
    - Selection of social virtues among competing groups
    - Continuity of human and animal minds
  representativeWorks:
    - { title: On the Origin of Species, year: 1859 }
    - { title: "The Descent of Man, and Selection in Relation to Sex", year: 1871, sourceId: darwin-descent }
    - { title: The Expression of the Emotions in Man and Animals, year: 1872 }
  notes: Darwin described himself as an agnostic (letter to John Fordyce, 7 May 1879) and is used for evolutionary anthropology, not as a representative of atheism.

- id: kitcher
  slug: philip-kitcher
  name: Philip Kitcher
  worldview: naturalism
  role: specialist
  displayOrder: 5
  usedFor: [pragmatic naturalist ethics, evolution of ethics]
  schools: [Pragmatic naturalism, Philosophy of biology]
  description: Philosopher of science who offers a pragmatist naturalist account of the origin and progress of ethics.
  bio: >-
    Philip Kitcher is a philosopher. He studied at Christ's College, Cambridge, and took a
    doctorate at Princeton in 1974. He taught at Vassar, Vermont, Minnesota and the University of
    California, San Diego, before joining Columbia University in 1999, where he is John Dewey
    Professor of Philosophy Emeritus. Known first for work in the philosophy of science and biology,
    including critiques of creationism and sociobiology, he later turned to ethics and secular
    humanism, writing Living with Darwin (2007), The Ethical Project (2011) and Life After Faith (2014).
  significance: >-
    Kitcher gives the most developed philosophical naturalist account of the origin of ethics and of
    moral progress: humans are incomplete psychological altruists, and ethics is a social technology
    for remedying that failure. He answers the question about human goodness and badness with a
    pragmatic, non-theistic history of how morality was built and refined.
  keyIdeas:
    - Humans as incomplete psychological altruists
    - Altruism failures
    - Ethics as social technology
    - Moral progress as functional refinement
    - Pragmatist (Deweyan) naturalism
  representativeWorks:
    - { title: Living with Darwin, year: 2007 }
    - { title: The Ethical Project, year: 2011 }
    - { title: Precis of The Ethical Project, year: 2012, sourceId: kitcher-ethical-project-precis }
    - { title: "Life After Faith: The Case for Secular Humanism", year: 2014 }
  notes: Represents one pragmatist form of naturalist ethics, not naturalism as a whole. His account of progress as functional refinement differs from moral realism (Railton) and error theory (Mackie).

- id: quine
  slug: w-v-o-quine
  name: W. V. O. Quine
  worldview: naturalism
  role: specialist
  displayOrder: 2
  usedFor: [naturalized epistemology, ontology, philosophy of language]
  schools: [Analytic philosophy, Naturalized epistemology]
  birthYear: 1908
  deathYear: 2000
  description: American philosopher whose naturalized epistemology treats knowledge as part of empirical inquiry rather than as grounded in a prior first philosophy.
  bio: >-
    Willard Van Orman Quine (1908–2000) was born in Akron, Ohio. He studied mathematics at Oberlin
    College and took his doctorate at Harvard with a dissertation on Whitehead and Russell's
    Principia Mathematica. In 1932–33 he travelled in Europe and met Rudolf Carnap in Prague. He
    taught at Harvard from 1936 until 1978, apart from naval intelligence work during the Second
    World War. He wrote widely on logic and set theory, and his essays "Two Dogmas of Empiricism"
    (1951) and "Epistemology Naturalized" (1969) and his book Word and Object (1960) made him one of
    the most influential analytic philosophers of the twentieth century.
  significance: >-
    Quine is the site's principal witness for naturalized epistemology: the view that there is no
    "first philosophy" outside science from which knowledge could be certified, so that the study of
    knowledge becomes part of natural science. He is also used for the claim that no statement, not
    even a law of logic, is in principle immune to revision. His own texts are under copyright and
    are quoted only as the Stanford Encyclopedia of Philosophy quotes them.
  keyIdeas:
    - No first philosophy outside science
    - Epistemology as a chapter of psychology
    - Holism about the testing of beliefs
    - No statement immune to revision
    - Rejection of the analytic-synthetic distinction
  representativeWorks:
    - { title: Two Dogmas of Empiricism, year: 1951 }
    - { title: Word and Object, year: 1960 }
    - { title: Epistemology Naturalized, year: 1969 }
  notes: Used for epistemology and ontology. Quine did not write on religion in a way that represents naturalistic atheism generally.

# --- Rabbinic Judaism --------------------------------------------------------------------
- id: maimonides
  slug: maimonides
  name: Moses Maimonides
  worldview: judaism
  role: primary
  displayOrder: 3
  schools: [Medieval Jewish rationalism, Halakhic codification]
  birthYear: 1138
  deathYear: 1204
  description: Physician, philosopher and codifier of Jewish law whose work joined rabbinic tradition with Aristotelian philosophy.
  bio: >-
    Moses ben Maimon (1138-1204), called Rambam, was born in Cordoba. His family left after the
    Almohad conquest and he arrived in Egypt in 1166, settling in Fustat. He completed his Arabic
    Commentary on the Mishnah in 1168 and wrote the Mishneh Torah, a comprehensive code of Jewish
    law in Hebrew. His philosophical masterpiece, the Guide of the Perplexed, was completed around
    1190. He earned his living as a physician, serving at the royal court, and led the Jewish
    community of Fustat. His authority was immense, and his thought was also contested from the
    start.
  significance: >-
    Maimonides gives the classic Jewish statements on free will, repentance, the divine image as intellect, the
    training of character, and the claim that most human evils are self-inflicted. He is the main medieval
    rationalist foil to Nachmanides on Eden and the origin of desire.
  keyIdeas:
    - Free choice as a foundation of Torah
    - Repentance (teshuvah) as cessation, regret, resolve and confession
    - The divine image as intellect
    - Most evils are self-inflicted
    - The ethical mean and the training of dispositions
  representativeWorks:
    - { title: "Commentary on the Mishnah (including the Eight Chapters, Shemonah Perakim)", year: 1168, sourceId: maimonides-eight-chapters }
    - { title: Mishneh Torah, sourceId: maimonides-mishneh-torah-touger }
    - { title: Guide of the Perplexed, year: 1190, sourceId: maimonides-guide-friedlander }
  notes: Birth year follows SEP (1138); some sources give 1135 or 1137. Mishneh Torah and Guide years are completion dates (the Guide's is sometimes given as c. 1185-1190). Registry sourceId maimonides-guide should be reconciled with maimonides-guide-friedlander.

- id: halevi
  slug: judah-halevi
  name: Judah Halevi
  worldview: judaism
  role: primary
  displayOrder: 2
  schools: [Medieval Jewish philosophy]
  era: 1050s or 1060s–1141
  description: Poet and philosopher who defended revealed religion and the particular vocation of Israel against philosophical rationalism.
  bio: >-
    Judah Halevi was born in the Iberian peninsula, probably at Tudela, in the 1050s or 1060s;
    his birth year is not known. He practised medicine and became one of the greatest Hebrew poets of the
    Middle Ages, writing secular verse, liturgical poems and poems of longing for Zion. His
    philosophical work, the Kuzari, is a dialogue between a king and a Jewish sage, written in
    Judeo-Arabic, probably in the few years before his departure in 1140. It defends Judaism as
    grounded in public revelation and tradition, and criticizes Aristotelian philosophy. In 1140 he
    left Spain for the Land of Israel, spent about eight months in Egypt, sailed on in 1141, and
    died there that summer.
  significance: >-
    Halevi offers a hierarchy of natural, animal, rational and divine levels of existence and sees human excellence as
    ordered rather than suppressed desire under divine influence. He also provides a Jewish counterweight to
    Maimonidean rationalism.
  keyIdeas:
    - The divine influence (amr ilahi)
    - Tradition and public revelation over speculation
    - Degrees of being
    - The election of Israel and the Land
    - Ordered rather than suppressed desire
  representativeWorks:
    - { title: "The Kuzari (Kitab al-Hujja wa-l-Dalil fi Nusr al-Din al-Dhalil)", sourceId: halevi-kuzari-hirschfeld }
    - { title: Poems of Zion }
  notes: Birth place (probably Tudela) and year (1050s-1060s) are uncertain per SEP. Registry sourceId halevi-kuzari should be reconciled with halevi-kuzari-hirschfeld.

- id: soloveitchik
  slug: joseph-b-soloveitchik
  name: Joseph B. Soloveitchik
  worldview: judaism
  role: primary
  displayOrder: 5
  schools: [Modern Orthodox Judaism]
  birthYear: 1903
  deathYear: 1993
  description: Talmudist and philosopher who gave modern Orthodoxy a religious anthropology and an account of halakhic life.
  bio: >-
    Joseph Ber Soloveitchik (1903-1993) was born in Pruzhany, then in the Russian Empire, into
    a family of Lithuanian Talmudists of the Brisker tradition. He earned a doctorate at the
    University of Berlin in 1932 with a dissertation on the philosophy of Hermann Cohen. He
    emigrated to the United States and settled in Boston, where he founded the Maimonides School
    in 1937. From 1941 until his retirement in 1985 he taught Talmud at Yeshiva University's
    RIETS, and almost two thousand rabbis were ordained under him. His essays, such as Halakhic Man and The Lonely
    Man of Faith, combine Talmudic method with neo-Kantian and existentialist philosophy. He
    died in 1993.
  significance: >-
    Soloveitchik offers a modern Jewish anthropology of two Adams, one majestic and creative, one covenantal and
    obedient, and grounds dignity in responsibility. He speaks directly to technology, creativity and civilization in
    this question.
  keyIdeas:
    - Adam the first and Adam the second
    - Dignity as responsibility
    - Majesty and covenant as complementary
    - Halakhic man as creator
    - Loneliness and the covenantal community
  representativeWorks:
    - { title: "Halakhic Man (Ish ha-Halakhah)", year: 1944, sourceId: soloveitchik-halakhic-man }
    - { title: The Lonely Man of Faith, year: 1965, sourceId: soloveitchik-lonely-man-of-faith }
    - { title: Kol Dodi Dofek, year: 1956 }
  notes: Years are those of first publication (Halakhic Man in Hebrew, 1944; English translation 1983).

- id: saadia
  slug: saadia-gaon
  name: Saadia Gaon
  worldview: judaism
  role: primary
  displayOrder: 1
  schools: [Medieval Jewish rationalism, Geonic tradition]
  birthYear: 882
  deathYear: 942
  description: Head of the Sura academy who gave the first systematic philosophical defense of rabbinic Judaism.
  bio: >-
    Saadia ben Joseph (882-942) was born in the Fayyum in Egypt and died in Baghdad. In 928 he was
    appointed gaon, or head, of the Sura academy in Babylonia, though his tenure was contested.
    Writing in Arabic within the intellectual world of early Islamic kalam, he composed the Book of
    Beliefs and Opinions, usually regarded as the first systematic work of Jewish philosophy. He
    also produced Arabic translations of the Bible, a commentary on the Sefer Yetzirah, a Hebrew
    dictionary, a prayer book, and grammatical and mathematical writings. He defended rabbinic
    Judaism against Karaite and other critics who dispensed with rabbinic authority.
  significance: >-
    Saadia supplies an early Jewish account of why humans, as the creatures endowed with wisdom, are commanded, judged
    and free, and so of both human dignity and accountability. On the site he also anchors the claim that reason and
    revelation are complementary sources of knowledge.
  keyIdeas:
    - Reason and revelation as joint sources of knowledge
    - Rational and revelational commandments
    - Humanity as the purpose and culmination of creation
    - Free choice without divine compulsion
    - Reward and punishment as just
  representativeWorks:
    - { title: "The Book of Beliefs and Opinions (Kitab al-Amanat wa-l-I'tiqadat; Emunot ve-De'ot)", sourceId: saadia-emunot-ibn-tibbon }
    - { title: Arabic translation of the Torah (Tafsir) }
    - { title: Siddur (prayer book) }

- id: nachmanides
  slug: nachmanides
  name: Nachmanides (Moses ben Nahman)
  worldview: judaism
  role: primary
  displayOrder: 4
  schools: [Medieval Talmudic scholarship, Kabbalah]
  era: 1194–c. 1270
  description: Spanish Talmudist and biblical commentator who combined halakhic scholarship with mystical interpretation and defended Judaism in the Barcelona disputation.
  bio: >-
    Moses ben Nahman (1194-c. 1270), known as Nachmanides or the Ramban, was born in Girona in
    Catalonia, where he became a leading rabbi and Talmudist and also practised medicine. He wrote
    novellae on the Talmud, legal works including Torat ha-Adam, and Milhamot ha-Shem, a defence
    of Alfasi against criticism. In 1263 he represented Judaism in the Barcelona Disputation against
    the convert Pablo Christiani. Afterwards he was sentenced to banishment; he left for the Land of
    Israel in 1267 and died around 1270, probably in Acre. His Torah commentary, written in his old
    age and added to after his arrival in the Land of Israel, joins plain-sense exegesis with
    Kabbalistic allusion.
  significance: >-
    Nachmanides reads the tree of knowledge as the origin of human will and desire, and the messianic healing of the
    heart as its remedy, the strongest medieval alternative to Maimonides on Eden. He gives the Jewish lane an
    account in which choice is both godlike and a burden.
  keyIdeas:
    - Original human nature acting naturally, as the heavens do
    - Choice as godlike yet burdensome
    - Divine assistance to the person who seeks purity
    - Messianic restoration of natural goodness
    - Kabbalistic layers within the plain sense of Torah
  representativeWorks:
    - { title: Commentary on the Torah, sourceId: ramban-torah-chavel }
    - { title: Torat ha-Adam }
    - { title: Milhamot ha-Shem }
    - { title: Sefer ha-Vikkuah (account of the 1263 disputation) }
  notes: Often critical of Maimonidean positions.

# --- Classical Islam ---------------------------------------------------------------------
- id: ash-ari
  slug: al-ashari
  name: Abu al-Hasan al-Ash'ari
  worldview: islam
  role: primary
  displayOrder: 1
  schools: [Ash'ari kalam]
  era: c. 874–936 (c. 260–324 AH)
  description: Theologian whose method gave rise to the Ash'ari school of Sunni kalam.
  bio: >-
    Abu al-Hasan 'Ali ibn Isma'il al-Ash'ari was born in Basra around 874 and died around 936. He studied under the Mu'tazili theologian al-Jubba'i and held Mu'tazili views
    until, around the age of forty, he broke with the school. Tradition attributes his change
    to dreams of the Prophet. He then defended the creed of the Sunni traditionists
    using the rational methods of kalam. His surviving writings include the Maqalat
    al-Islamiyyin, a survey of Muslim sects, the Kitab al-Luma', and the al-Ibana. His
    followers developed the Ash'ari school, which became highly influential in Sunni theology.
  significance: >-
    Al-Ash'ari supplies the framework that al-Ghazali inherits: God creates all acts, humans "acquire" them (kasb), and
    moral obligation comes from revelation. The site uses him for the Sunni kalam view of will and responsibility.
  keyIdeas:
    - God's will and power extend to all events, including human acts
    - Acquisition (kasb) as the human relation to created acts
    - Obligation grounded in revelation, not in intrinsic moral properties
    - Divine attributes affirmed "without asking how"
    - Rational kalam used to defend scriptural doctrine
  representativeWorks:
    - { title: Maqalat al-Islamiyyin }
    - { title: Kitab al-Luma' }
    - { title: "al-Ibana 'an Usul al-Diyana (The Elucidation of Islam's Foundation)", sourceId: ashari-ibana-klein }
  notes: Dates are approximate. The authenticity of al-Ibana is questioned by some scholars.

- id: maturidi
  slug: al-maturidi
  name: Abu Mansur al-Maturidi
  worldview: islam
  role: primary
  displayOrder: 2
  schools: [Maturidi kalam]
  deathYear: 944
  description: Samarqand theologian and eponym of the Maturidi school of Sunni kalam.
  bio: >-
    Abu Mansur Muhammad al-Maturidi died in 944 (333 AH), in or near Samarqand; his birth date is
    unknown. He came from Maturid, a district of Samarqand in Transoxiana, and belonged to the
    Hanafi legal tradition. His main works are the Kitab al-Tawhid, a systematic theological
    treatise, and the Ta'wilat, a large commentary on the Qur'an. He defended Sunni belief
    against Mu'tazili and other rivals using reasoned argument. Later scholars in
    Transoxiana and beyond built on his work, and the Maturidi school became the leading
    theology among Hanafi Muslims, alongside the Ash'ari school.
  significance: >-
    Al-Maturidi represents the Hanafi-Maturidi strand, with greater confidence than the Ash'aris in reason's moral
    competence and in real human choice. He gives the Islamic lane a second, distinct Sunni account of freedom and
    responsibility.
  keyIdeas:
    - Knowing God is rationally obligatory
    - Reason can often know good and bad, though revelation is final
    - Human nature as natural constitution plus intellect
    - Real choice (ikhtiyar) within God's creation of acts
    - Divine wisdom (hikma) grounding the moral order
  representativeWorks:
    - { title: Kitab al-Tawhid }
    - { title: Ta'wilat (Qur'an commentary) }
  notes: Death date is firm; birth is unknown. Some modern sources give c. 852, which is not securely attested.

- id: ghazali
  slug: al-ghazali
  name: Abu Hamid al-Ghazali
  worldview: islam
  role: primary
  displayOrder: 4
  schools: [Ash'ari kalam, Sufism]
  era: c. 1056–1111
  description: Theologian, jurist and mystic whose critique of the philosophers and synthesis of kalam and Sufism were widely influential.
  bio: >-
    Abu Hamid Muhammad al-Ghazali was born in 1055 or 1056 at Tabaran-Tus in Khurasan and died
    in 1111. A Shafi'i jurist and Ash'ari theologian, he studied at Nishapur and in 1091 was
    appointed to the Nizamiyya madrasa in Baghdad. In 1095, after a personal crisis, he left
    his post, and he subsequently adopted the Sufi path, performing the pilgrimage in 1096.
    He returned to teach at the Nizamiyya in Nishapur in 1106 and died at Tus. His works include the Incoherence of the Philosophers (c. 1095) and
    the Revival of the Religious Sciences, a compendium of religious practice and ethics.
  significance: >-
    The Ihya' gives the fullest classical Sunni moral psychology of heart, self, desire, sin and repentance, which
    is why al-Ghazali is the main Islamic source on how one nature is both great and fallen. He also sets the
    Sunni relation between kalam, Sufism and philosophy.
  keyIdeas:
    - The heart (qalb) as a subtle, lordly reality and the true self
    - Four qualities within each person (brutish, predatory, demonic, lordly)
    - The heart as a mirror and sin as rust
    - Virtue as balance of faculties acquired by discipline (riyada)
    - Repentance as knowledge, remorse and action
    - Moral value known through revelation (Ash'ari)
  representativeWorks:
    - { title: "Ihya' 'Ulum al-Din, Book 21: The Marvels of the Heart", sourceId: ghazali-marvels-heart }
    - { title: "Ihya' 'Ulum al-Din, Books 22-23: On Disciplining the Soul and On Breaking the Two Desires", sourceId: ghazali-disciplining-soul }
    - { title: "Ihya' 'Ulum al-Din, Book 31: On Repentance", sourceId: ghazali-repentance-stern }
    - { title: Tahafut al-Falasifa, year: 1095 }
    - { title: al-Munqidh min al-Dalal }
  notes: Birth year corrected from the registry's 1058 to c. 1056 (SEP, from his own letters and autobiography); 1058-59 is a later historians' dating. Tahafut year is approximate.

- id: razi
  slug: fakhr-al-din-al-razi
  name: Fakhr al-Din al-Razi
  worldview: islam
  role: primary
  displayOrder: 5
  schools: [Ash'ari kalam, Philosophical theology]
  deathYear: 1210
  description: Theologian, philosopher and Qur'an commentator who integrated Avicennan philosophy into Ash'ari kalam.
  bio: >-
    Fakhr al-Din al-Razi was an Ash'ari theologian and philosopher of the eastern Islamic world who died
    in 1210 (606 AH). He wrote the great Qur'an commentary Mafatih al-Ghayb ("The Keys of the Unseen"),
    commented on works of Ibn Sina, and, like al-Ghazali before him, fought the philosophers on their
    own ground; Duncan Black Macdonald's 1903 history also records his correspondence with the Sufi
    Ibn Arabi. His commentary characteristically sets out the objections to a reading and the rival
    opinions of earlier scholars at length before giving its answers, as it does on Qur'an 4:157.
  significance: >-
    Al-Razi matters to Worldviews Examined because his commentary on Qur'an 4:157 states, from within the tradition,
    the strongest objection to the substitution reading of Jesus' death: that God's casting one man's likeness on
    another would undermine sense knowledge and mass-transmitted testimony. He also records that the substitution
    stories conflict with one another. His commentary on Qur'an 4:78-79 is also a clear statement of the Ash'ari reading
    of divine decree, in which God creates acts of obedience and disobedience alike.
  keyIdeas:
    - Kalam engaged with Avicennan philosophy
    - All things other than God, human acts included, depend on him as merely possible in themselves
    - Mass-transmitted report (tawatur) as a source of certain knowledge
    - The objection that substitution "opens the door of sophistry"
    - Commentary as systematic disputation of objections and replies
  representativeWorks:
    - { title: "Mafatih al-Ghayb (al-Tafsir al-kabir)", sourceId: razi-mafatih-al-ghayb }
    - { title: al-Matalib al-'Aliya }
  notes: Biography from Macdonald, Development of Muslim Theology (1903), p. 241 (death 606 AH, the Mafatih al-Ghayb, Ibn Sina, Ibn Arabi), and from al-Razi's commentary on 4:157 as read 2026-10-07; the previously registered birth year (1149) could not be verified in a read source during the 2026-10-07 independent review and was removed, so only the death year (606 AH / 1210) is published. Profiled at first public use (Islam `jesus`).

- id: ibn-taymiyya
  slug: ibn-taymiyya
  name: Ibn Taymiyya
  worldview: islam
  role: primary
  displayOrder: 6
  schools: [Hanbali jurisprudence, Athari theology]
  birthYear: 1263
  deathYear: 1328
  description: Damascene jurist and theologian who argued from revelation against kalam and philosophical rationalism.
  bio: >-
    Taqi al-Din Ahmad ibn Taymiyya (1263-1328) was born in Harran, in what is now southeastern
    Turkey, and raised in Damascus after his family left in the face of the Mongol advance. A
    Hanbali jurist, he inherited his father's teaching post at the Sukkariyya madrasa in 1284.
    He issued influential legal opinions, wrote against Ash'ari and philosophical theology, Shi'i
    doctrine and some Sufi practices, and took part in public life in Syria. His positions led
    to repeated trials and several periods of imprisonment in Cairo, Alexandria and Damascus,
    and he died in the Damascus citadel in 1328.
  significance: >-
    Ibn Taymiyya offers the strongest account of the fitra, an innate disposition to know and worship God that
    includes moral intuitions, and of humans as beings who necessarily love and worship something. He is the main
    Athari alternative to Ash'ari and Maturidi kalam on human nature and agency. His Correct Answer gives the classic
    Muslim account of how the Qur'an can confirm the Torah and the Gospel while correcting the Jewish and Christian
    readings of them.
  keyIdeas:
    - The fitra as innate disposition, perfected by prophecy
    - Humans necessarily love and worship something
    - God creates acts through human will and power
    - Divine acts have wise purposes
    - Revealed law as coextensive with justice and benefit
    - Revelation and sound reason do not truly conflict
    - Every proof rests on entailment; the logicians' syllogism is valid but not required for certainty
    - Earlier scriptures distorted chiefly in meaning and interpretation, only a little in wording
  representativeWorks:
    - { title: al-'Aqida al-Wasitiyya }
    - { title: "Dar' Ta'arud al-'Aql wa-l-Naql (Averting the Conflict between Reason and Revealed Tradition)", sourceId: ibn-taymiyya-dar-taarud }
    - { title: "al-Radd 'ala al-Mantiqiyyin (Refutation of the Logicians)", sourceId: ibn-taymiyya-radd-mantiqiyyin }
    - { title: "al-Jawab al-Sahih li-man Baddala Din al-Masih (The Correct Answer to Those Who Changed the Religion of the Messiah)", sourceId: ibn-taymiyya-jawab-sahih }
    - { title: "al-Siyasa al-Shar'iyya (Law-Guided Public Policy)" }
  notes: Dar' Ta'arud was written after 1313 and al-Siyasa around 1310 (SEP). Wasitiyya date not verified. R4 (2026-10-08) read passages of the Dar' (vol. 1), the Radd and the Jawab in Arabic; see their source records.

- id: ibn-sina
  slug: avicenna-ibn-sina
  name: Avicenna (Ibn Sina)
  worldview: islam
  role: primary
  displayOrder: 3
  schools: [Islamic philosophy, Peripatetic tradition]
  era: c. 970–1037
  description: Philosopher and physician whose metaphysics of the Necessary Existent shaped later Islamic theology and philosophy.
  bio: >-
    Abu 'Ali al-Husayn ibn Sina (c. 970-1037) was born at Afshana near Bukhara and educated
    there. He fled Bukhara in 999 and worked as a physician and political counsellor to rulers in
    several cities, including Hamadan and Isfahan, spending his last years in Isfahan at the court
    of the Kakuyid ruler 'Ala' al-Dawla, and died at Hamadan in 1037. In the Peripatetic tradition
    of falsafa, he developed a comprehensive philosophical system in the Book of Healing (al-Shifa')
    and the later Pointers and Reminders. His Canon of Medicine was a standard medical text for
    centuries. His metaphysics of the Necessary Existent and his psychology of the soul influenced
    Muslim, Jewish and Latin Christian thinkers.
  significance: >-
    Ibn Sina offers the philosophical account of human greatness as the perfection of the rational soul through
    knowledge, and of evil as privation. He represents falsafa, which is not identical with kalam: Ash'ari and
    other theologians accepted parts of his thought and rejected others.
  keyIdeas:
    - Immaterial rational soul
    - Internal senses, including estimation (wahm)
    - Happiness as the intellectual perfection of the soul
    - Prophecy as supremely developed intellect and imagination
    - Evil as privation in a world of generation and corruption
    - Necessary Existent and contingent beings
  representativeWorks:
    - { title: "The Book of Healing (al-Shifa')", year: 1020 }
    - { title: al-Najat }
    - { title: al-Isharat wa-l-Tanbihat }
    - { title: Canon of Medicine }
  notes: SEP gives ca. 970-1037 (birth uncertain; traditional 980). Shifa' completion year removed as unverified. Islamic philosophy is not simply identical with orthodox kalam; entries should say which they represent.

- id: ibn-arabi
  slug: ibn-arabi
  name: Ibn Arabi
  worldview: islam
  role: specialist
  displayOrder: 1
  usedFor: [mystical theology, Sufi metaphysics]
  schools: [Sufism]
  birthYear: 1165
  deathYear: 1240
  description: Andalusian mystic and author of an influential Sufi metaphysics of divine self-disclosure.
  bio: >-
    Muhyi al-Din Ibn al-'Arabi (1165-1240) was born in Murcia in al-Andalus and studied with many
    teachers in al-Andalus and North Africa. In 1201 he left the Muslim West for the pilgrimage to Mecca,
    and began writing his vast work al-Futuhat al-Makkiyya after the pilgrimage. After travelling
    through Iraq and Anatolia, he settled in Damascus in 1223 and remained there until his death in
    1240. His shorter Fusus al-Hikam became the subject of more than a hundred commentaries. His
    writings on the divine names, the cosmos and the Perfect Human shaped later Sufism and Islamic
    philosophy.
  significance: >-
    Ibn Arabi gives the human as the comprehensive being able to realise every divine name, and hence every
    possibility, high and low. His views are contested within Sunni thought, so he serves as a specialist source for
    mystical theology and not as the default Islamic account.
  keyIdeas:
    - The human created in the form of the all-comprehensive name Allah
    - Deiformity (takhalluq bi-asma' Allah)
    - The Perfect Human (al-insan al-kamil)
    - Divine self-disclosure
    - Creative command versus prescriptive command
  representativeWorks:
    - { title: al-Futuhat al-Makkiyya }
    - { title: Fusus al-Hikam }
  notes: Futuhat drafts completed 1231 and 1238 (start year not verified). Used for mystical theology. His views are contested within mainstream Sunni thought (Ibn Taymiyya was among critics) and should not be treated as the default Islamic account.

# --- Hindu traditions --------------------------------------------------------------------
- id: ibn-khaldun
  slug: ibn-khaldun
  name: Ibn Khaldun
  worldview: islam
  role: specialist
  displayOrder: 2
  usedFor: [philosophy of history, rise and fall of dynasties]
  schools: [Maliki jurisprudence, Historiography]
  birthYear: 1332
  deathYear: 1406
  description: North African historian and jurist whose Muqaddimah analysed the rise and decline of dynasties.
  bio: >-
    Ibn Khaldun was born in Tunis in 1332 to a family of Yemeni origin long settled in Seville. At
    twenty he became secretary to the Hafsid sultan, and he went on to serve the Marinid court at Fez,
    the Nasrid king of Granada (who sent him on an embassy to Pedro the Cruel of Castile), and princes
    at Bougie and Tlemcen, with a spell in prison along the way. In a four-year retreat at the castle of
    Qal'at Ibn Salama, in present-day Algeria, he composed the Muqaddimah (Prolegomena) and drafted his
    universal history. From 1382 he lived in Cairo, where he was several times appointed chief Maliki
    judge. In 1400, accompanying the sultan to Syria, he fell into the hands of Timur, and was later released. He died in Cairo in 1406.
  significance: >-
    Ibn Khaldun is the classical Muslim thinker who described recurring cycles in political history: dynasties rise
    on group solidarity and decline within about three generations. He matters to Worldviews Examined because his
    cycles operate inside the Qur'an's linear sacred history, showing that recurring patterns are not a cyclical
    cosmology.
  keyIdeas:
    - Group solidarity (asabiyya) as the force that founds dynasties
    - Dynasties last about three generations, roughly 120 years
    - Empires have a natural life like individuals
    - History as a science of civilization, open to critical testing of reports
  representativeWorks:
    - { title: "Muqaddimah (Les prolégomènes, vol. 1, trans. de Slane)", year: 1863, sourceId: ibn-khaldun-prolegomenes-slane }
  notes: Biography from de Slane's introduction to the Prolégomènes (vol. 1, pp. iii-v, read 2026-10-07). Profiled at first public use (Islam `history`).

- id: shafii
  slug: al-shafii
  name: al-Shafi'i
  worldview: islam
  role: specialist
  displayOrder: 3
  usedFor: [jurisprudence, sources of law]
  schools: [Shafi'i jurisprudence]
  birthYear: 767
  deathYear: 820
  description: Jurist whose Risala set out how the Qur'an, Sunna, consensus and analogy yield Islamic law.
  bio: >-
    Muhammad ibn Idris al-Shafi'i (150-204 AH, 767-820) lived in the generation when Muslim jurists were divided
    between traditionists, who wished to build law on the Qur'an and prophetic reports alone, and speculative
    lawyers, who leaned on reasoned opinion. Duncan Black Macdonald's history presents him as the mediator between
    them: deeply reverent toward prophetic tradition, yet willing to extend the law by disciplined analogy. His
    Risala, preserved in the copy of his pupil al-Rabi' ibn Sulayman, sets out how the Qur'an, the Sunna, consensus
    and analogy yield knowledge of God's law, and the school of law that bears his name grew from his teaching.
  significance: >-
    Al-Shafi'i matters to Worldviews Examined because his Risala shows from the inside how Sunni Islam binds
    authority to revelation: the Sunna is authoritative because the Qur'an commands obedience to the Prophet,
    consensus binds because it cannot contradict the Sunna, and analogy works only where those are silent.
  keyIdeas:
    - The Sunna as the "wisdom" taught with the Book and its authoritative explanation
    - Consensus binding because the whole community cannot agree against the Sunna
    - Analogy and ijtihad as "two names for one meaning", right in the outward but not certain
  representativeWorks:
    - { title: "al-Risala", sourceId: shafii-risala-shakir }
  notes: Dates from the catalog card of Shakir's edition (150-204 AH); characterization from Macdonald pp. 103-108 and the Risala as read 2026-10-08. Profiled at first public use from the primary text (Islam `ultimate-authority`).

- id: saduq
  slug: al-shaykh-al-saduq
  name: al-Shaykh al-Saduq
  worldview: islam
  role: specialist
  displayOrder: 4
  usedFor: [Twelver Shi'a doctrine, the Imamate]
  schools: [Twelver (Imami) Shi'ism]
  deathYear: 991
  description: Twelver Shi'a scholar whose short creed is one of the earliest statements of Imami belief.
  bio: >-
    Abu Ja'far Muhammad ibn 'Ali Ibn Babawayh al-Qummi, known as al-Shaykh al-Saduq, died at Rayy in 381 AH (991).
    He compiled one of the "four books" of Twelver hadith and is regarded among the Twelver Shi'a as a great
    authority. His Risalat al-I'tiqadat, translated by Asaf A. A. Fyzee as A Shi'ite Creed (1942), is one of the
    earliest surviving Twelver creeds, setting out belief in God, the prophets, the twelve Imams, infallibility and
    the last things.
  significance: >-
    Al-Saduq matters to Worldviews Examined because his creed states the Twelver doctrine of authority after the
    Prophet: twelve infallible Imams as God's proofs and the interpreters of revelation, the last of them hidden
    and awaited as the Mahdi. It lets the site mark where Shi'a belief differs from the Sunni baseline without
    relying on a hostile summary.
  keyIdeas:
    - The twelve Imams as God's proofs and interpreters of revelation after the Prophet
    - Infallibility of prophets and Imams
    - The hidden twelfth Imam as the awaited Mahdi
    - The received Qur'an as the complete Qur'an
  representativeWorks:
    - { title: "Risalat al-I'tiqadat al-Imamiyya (A Shi'ite Creed, trans. Fyzee)", year: 1942, sourceId: saduq-shiite-creed-fyzee }
  notes: Biography from Fyzee's preface and introduction (death at Rayy 381/991; author of one of the four books); birthplace and birth year not given there and not published. Profiled at first public use (Islam `ultimate-authority`, `history`).

- id: shankara
  slug: shankara
  name: Shankara
  worldview: hinduism
  role: primary
  displayOrder: 1
  schools: [Advaita Vedanta]
  era: 8th century CE (dates debated; proposals include 788–820, 700–750, or late 7th–early 8th century)
  description: Commentator on the Upanishads, Bhagavad Gita and Brahma Sutras and the foundational figure of Advaita Vedanta.
  bio: >-
    Shankara (Śaṅkara) was a Sanskrit commentator whose dates are debated: older scholarship gave 788–820 CE, Nakamura proposed 700–750, and others the late seventh or early eighth century. No dependable historical record of his life survives beyond his writings. Hagiographies composed centuries later place his birth in Kerala, describe him as a young renouncer and travelling teacher, and say he died at thirty-two; these details are traditional, not verified. He was a systematizer rather than the founder of Advaita Vedanta, a pupil of Govinda, who was himself a pupil of Gaudapada. His earliest complete extant commentaries treat the Brahma Sutras, the Bhagavad Gita and the principal Upanishads, and he also wrote the Upadeshasahasri. Many other texts are attributed to him but probably come from later monastic leaders.
  significance: Shankara supplies the classical non-dual Vedanta account of human greatness and failure, tracing misery and wrongdoing to a beginningless misidentification of the self, and his Gita commentary analyses how desire veils knowledge. Advaita is one Hindu school among several and must not stand for Hindu traditions as a whole.
  keyIdeas:
    - Adhyāsa (superimposition)
    - Avidyā (ignorance)
    - Identity of ātman and brahman
    - Two levels of reality
    - Sākṣin (witness-consciousness)
    - Knowledge as the means of liberation
  representativeWorks:
    - { title: Brahmasutra-bhashya, sourceId: thibaut-shankara-brahmasutra }
    - { title: Bhagavad-gita-bhashya, sourceId: sastri-gita-shankara }
    - { title: Upanishad commentaries }
    - { title: Upadeshasahasri }
  notes: Advaita is one Hindu school and must not stand for Hindu traditions as a whole.

- id: ramanuja
  slug: ramanuja
  name: Ramanuja
  worldview: hinduism
  role: primary
  displayOrder: 2
  schools: [Vishishtadvaita Vedanta, Sri Vaishnavism]
  era: traditionally 1017–1137 CE; recent scholarship proposes 1077–1157
  description: Vedanta theologian who argued that the world and souls are real modes of a personal Brahman, joining philosophy to devotion.
  bio: >-
    Ramanuja (Rāmānuja) is traditionally dated 1017–1137 CE, though recent scholarship proposes 1077–1157. He was born at Sriperumbudur near modern Chennai into a Tamil-speaking Brahmin family and studied at Kanchipuram under Yadavaprakasha, with whom he came to disagree. He became the leading figure of the Sri Vaishnava community, a Tamil devotional tradition shaped by Yamunacarya, and set out its philosophy in Sanskrit for a pan-Indian audience. His main works are the Sri Bhashya on the Brahma Sutras, the Vedarthasamgraha, and a commentary on the Bhagavad Gita. Some scholars question the authenticity of the Gadyatraya and some shorter works. He articulated Vishishtadvaita, "qualified non-dualism", and defended theism against non-dualist readings of Vedanta.
  significance: Ramanuja offers a theistic Vedanta account in which the individual self is real, eternal and a mode of God, its knowledge contracted by karma and restored through devotion and surrender. This contrasts with Advaita and shows internal diversity within Hindu answers on human dignity and evil.
  keyIdeas:
    - Viśiṣṭādvaita (qualified non-dualism)
    - Body–soul (śarīra–śarīrin) relation of world to God
    - Real, individual selves
    - Karma contracting the self's knowledge
    - Bhakti and prapatti (surrender)
    - Critique of Advaita avidyā
  representativeWorks:
    - { title: Sri Bhashya, sourceId: thibaut-ramanuja-sribhashya }
    - { title: Vedarthasamgraha }
    - { title: Bhagavad-gita-bhashya, sourceId: govindacharya-gita-ramanuja }
    - { title: Gadyatraya (authenticity contested) }

- id: madhva
  slug: madhva
  name: Madhva
  worldview: hinduism
  role: primary
  displayOrder: 3
  schools: [Dvaita Vedanta]
  era: 13th–14th century CE (traditionally 1238–1317)
  description: Vedanta theologian who taught an irreducible difference between God, souls and matter.
  bio: >-
    Madhva (also called Madhvacharya or Ananda Tirtha) is traditionally dated 1238–1317 CE, though some scholars give 1197–1276. He is said to have been born at Pajaka near Udupi on the coast of Karnataka, and the Madhva community still has its main centre at Udupi. He taught Dvaita Vedanta, which he called Tattvavada, the "realist viewpoint": the Vedanta texts, he held, teach a fundamental difference between God and the individual self. He wrote commentaries on the Brahma Sutras, the Bhagavad Gita and the principal Upanishads, along with independent works. His followers regard him as an incarnation of the wind-god Vayu, a sectarian belief and not a historical finding. He is a major critic of non-dualist Vedanta.
  significance: Madhva makes souls permanently distinct, dependent agents with differing natures, which changes how Hindu traditions answer questions about dignity, merit and evil. He extends the project's range beyond Advaita and Vishishtadvaita.
  keyIdeas:
    - Pañcabheda (five fundamental differences)
    - Svatantra and paratantra (independent and dependent reality)
    - Tāratamya (gradation of souls)
    - Realism (Tattvavāda)
    - Liberation through Viṣṇu's grace and bhakti
  representativeWorks:
    - { title: Brahmasutra-bhashya, sourceId: subbarau-madhva-brahmasutra }
    - { title: Bhagavad-gita-bhashya }

- id: udayana
  slug: udayana
  name: Udayana
  worldview: hinduism
  role: primary
  displayOrder: 4
  schools: [Nyaya]
  era: late 10th century CE
  description: Nyaya philosopher who developed the realist natural-theological tradition, arguing for God as creator and answering Buddhist critics.
  bio: >-
    Udayana (Udayanācārya) is usually dated to the late tenth or early eleventh century CE and is associated with Mithila in north-eastern India. He worked within the combined Nyaya-Vaisesika tradition, which held that the world is made of real, enduring substances and atoms, knowable through perception and inference. His Nyayakusumanjali ("Handful of Flowers of Reasoning") is the classical Hindu treatise arguing for the existence of God (Isvara) by reason; his Atmatattvaviveka defends an enduring self against Buddhist critics. He also wrote commentaries on earlier Nyaya and Vaisesika works. Later Indian logicians regarded him as a forerunner of the "new" Nyaya (Navya-Nyaya) school.
  significance: Udayana is the site's principal Hindu witness for arguing to God from the world rather than from scripture alone. His Kusumanjali infers an omniscient maker from the world's being an effect and from the joining of atoms at the start of each world-cycle, which the Vedanta schools, Ramanuja especially, rejected as a route to Brahman. He is used for the existence question and for natural order.
  keyIdeas:
    - Inference to God (Isvara) from effects
    - Intelligent agency in the combining of atoms
    - Realism about substances and atoms (Nyaya-Vaisesika)
    - God as orderer of atoms, not creator from nothing
    - Defence of an enduring self against Buddhism
  representativeWorks:
    - { title: Nyayakusumanjali, sourceId: cowell-kusumanjali }
    - { title: Atmatattvaviveka }
  notes: Represents the Nyaya realist and natural-theological strand, widening Hindu representation beyond Vedanta.

- id: kumarila
  slug: kumarila-bhatta
  name: Kumarila Bhatta
  worldview: hinduism
  role: primary
  displayOrder: 5
  schools: [Mimamsa]
  era: flourished c. 660 CE
  description: Mimamsa philosopher who defended the authority of the Veda and developed theories of language and knowledge.
  bio: >-
    Kumarila Bhatta (Kumārila Bhaṭṭa) flourished around 660 CE, a contemporary of the Buddhist logician Dharmakirti. Little is securely known of his life; there is some evidence that he came from South India. He belonged to Purva Mimamsa, the school concerned with interpreting the Vedic ritual texts and the nature of dharma, and gave his name to the Bhatta sub-school. His main works are the Slokavarttika, a verse treatise on epistemology and language; the Tantravarttika, on the interpretation of the Veda; and the Tuptika. A longer commentary, the Brhattika, is lost. He engaged critically with Buddhist philosophers, especially Dignaga and Dharmakirti, and his arguments influenced later Buddhist thought.
  significance: Kumarila shows how Vedic authority and the intrinsic reliability of knowledge ground Hindu accounts of moral knowledge, and his defence of an enduring self underwrites responsibility across lives against the Buddhist no-self view. He is used chiefly for knowledge, language and authority.
  keyIdeas:
    - Svataḥ prāmāṇya (intrinsic validity of cognition)
    - Apauruṣeyatva (authorless Veda)
    - Dharma known through Vedic injunction
    - Realism about universals and language
    - Enduring self against Buddhist no-self
  representativeWorks:
    - { title: Slokavarttika, sourceId: jha-slokavarttika }
    - { title: Tantravarttika }
    - { title: Tuptika }
  notes: Represents Mimamsa, particularly Vedic authority, language and epistemology.

- id: abhinavagupta
  slug: abhinavagupta
  name: Abhinavagupta
  worldview: hinduism
  role: specialist
  displayOrder: 1
  usedFor: [nondual Shaiva philosophy, aesthetics, consciousness]
  schools: [Kashmir Shaivism]
  era: c. 10th–11th century CE (latest known date 1015)
  description: Kashmir Shaiva philosopher and aesthetic theorist who set out a nondual philosophy of consciousness and a theory of aesthetic experience.
  bio: >-
    Abhinavagupta was a Kashmiri scholar of the late tenth and early eleventh centuries; his latest known date is 1015 CE. His fame rests chiefly on his philosophical works on Kashmir Shaivism, which include two commentaries on the Ishvarapratyabhijna of Utpala, his teacher's teacher. In poetics he wrote two commentaries that carry the weight of independent treatises: the Abhinavabharati on Bharata's Natyashastra, the classical treatise on drama, and the Locana on Anandavardhana's Dhvanyaloka, the founding work of the theory of suggestion (dhvani). Later writers on poetics, among them Mammata and Vishvanatha, took up his account of rasa.
  significance: Abhinavagupta gives classical Indian aesthetics its most influential theory of how art produces delight, rasa as the relish of a generalised emotion in the responsive spectator. He is used for the question of beauty and creativity, not as a representative of Hindu theology as a whole.
  keyIdeas:
    - Rasa as relish (asvada, carvana) manifested by suggestion
    - Generalisation of emotion in aesthetic experience
    - The responsive spectator (sahrdaya)
    - Suggestion (dhvani) as the soul of poetry
  representativeWorks:
    - { title: Abhinavabharati (commentary on the Natyashastra) }
    - { title: Locana (commentary on the Dhvanyaloka) }
    - { title: Tantraloka }

# --- Buddhist traditions -----------------------------------------------------------------
- id: buddhaghosa
  slug: buddhaghosa
  name: Buddhaghosa
  worldview: buddhism
  role: primary
  displayOrder: 1
  schools: [Theravada]
  era: flourished early 5th century CE
  description: Commentator who systematized the Theravada understanding of the Pali Canon.
  bio: >-
    Buddhaghosa ("voice of the Buddha") flourished in the early fifth century CE. Tradition holds that he was an Indian monk who travelled to Sri Lanka and worked at Anuradhapura, where he is said to have rendered the older Sinhalese commentaries into Pali. His Visuddhimagga ("Path of Purification") is an encyclopaedic summary of Theravada doctrine and meditation, organised around virtue, concentration and understanding. He also wrote, or is credited with, commentaries on the Vinaya and the Nikayas. Theravada tradition regards him as its most important commentator, and his interpretations have shaped orthodox readings of the Pali scriptures.
  significance: Buddhaghosa gives the most systematic Theravada map of the mental factors behind good and evil and of their purification, supplying the Theravada side of the Buddhist answer to human greatness and failure.
  keyIdeas:
    - Path of purification (virtue, concentration, understanding)
    - Near and far enemies of the divine abidings
    - Conscience and moral dread as guardians of the world
    - Dependent origination without a creator
    - Anusaya (latent tendencies)
  representativeWorks:
    - { title: Visuddhimagga, sourceId: buddhaghosa-path-of-purification }
    - { title: Commentaries on the Pali Nikayas }

- id: nagarjuna
  slug: nagarjuna
  name: Nagarjuna
  worldview: buddhism
  role: primary
  displayOrder: 2
  schools: [Madhyamaka, Mahayana]
  era: c. 150–250 CE
  description: Founder of the Madhyamaka school, whose analysis of emptiness and dependent origination shaped Mahayana philosophy.
  bio: >-
    Nagarjuna (Nāgārjuna) lived roughly between 150 and 250 CE, probably in southern India, and was a Buddhist monk. Very little can be said precisely about his life, and the traditional biographies, with their legends of serpent-spirits (nagas), are largely legendary. Works were often attributed to him later, and more than one author named Nagarjuna may be involved, though scholars generally accept groups of argumentative works, hymns and letters as his. His most important work is the Mulamadhyamakakarika, about 450 verses arguing that nothing has intrinsic nature (svabhava). He is regarded as the founder of Madhyamaka, the "Middle Way" school, and a reading of him as Prasangika became the official position of Tibetan Buddhism.
  significance: Nagarjuna shows how moral agency and transformation can be understood without a substantial self, and argues that emptiness makes action and ethics possible rather than undermining them. He anchors the Madhyamaka strand used across the site.
  keyIdeas:
    - Śūnyatā (emptiness) as absence of svabhāva
    - Emptiness identified with dependent origination
    - Two truths
    - Mutual dependence of agent and action
    - Defilements from conceptual proliferation (prapañca)
  representativeWorks:
    - { title: Mulamadhyamakakarika, sourceId: nagarjuna-mmk }
    - { title: Ratnavali }
    - { title: Vigrahavyavartani }

- id: vasubandhu
  slug: vasubandhu
  name: Vasubandhu
  worldview: buddhism
  role: primary
  displayOrder: 3
  schools: [Abhidharma, Yogacara]
  era: 4th or 5th century CE (dating disputed)
  description: Scholastic author of an Abhidharma compendium and later a leading Yogacara philosopher.
  bio: >-
    Vasubandhu lived in the fourth or fifth century CE, in the Gupta period; the dating is disputed. Tradition makes him a native of Gandhara who studied in Kashmir and later lived at Ayodhya under royal patronage. He wrote the Abhidharmakosa and its commentary, a systematic treatment of Abhidharma from a Sarvastivada and Sautrantika standpoint, and is also credited with Yogacara works, including the Twenty Verses, the Thirty Verses and the Exposition of the Three Natures. Since the 1950s some scholars, following Frauwallner, have argued that two authors of this name were merged into one; others defend a single author. His writings treat no-self, momentariness, karma as intention and "appearance-only" (vijnaptimatra).
  significance: Vasubandhu's doctrine of latent tendencies and, in Yogacara, the storehouse and afflicted mind give a deep Buddhist account of habitual, pre-reflective disorder, which bears on the "terrible" half of the question.
  keyIdeas:
    - Karma as intention (cetanā)
    - Anuśaya (latent tendencies)
    - Ālayavijñāna (storehouse consciousness)
    - Vijñaptimātra (appearance-only)
    - Three natures (trisvabhāva)
  representativeWorks:
    - { title: Abhidharmakosa and Bhashya }
    - { title: Vimshatika (Twenty Verses) }
    - { title: Trimshika (Thirty Verses), sourceId: vasubandhu-trimsika }
    - { title: Trisvabhavanirdesha }

- id: shantideva
  slug: shantideva
  name: Shantideva
  worldview: buddhism
  role: specialist
  displayOrder: 1
  usedFor: [ethics, the bodhisattva path]
  schools: [Madhyamaka, Mahayana]
  era: late 7th to mid-8th century CE
  description: Indian Mahayana poet-monk whose work sets out the path of the bodhisattva.
  bio: >-
    Shantideva (Śāntideva) lived between the late seventh and mid-eighth century CE and is thought to have studied at the monastic university of Nalanda in northern India. He is associated with Madhyamaka, and Tibetan tradition counts him as a Prasangika. Knowledge of his life comes mainly from later Tibetan accounts. One legend says that fellow monks, who thought him idle, asked him for an original composition; he recited the Bodhicaryavatara, rose into the air, and vanished at the verses on emptiness. This story is traditional. The Bodhicaryavatara ("Entering the Bodhisattva's Way of Life") is a poem of about a thousand verses on generating the awakening mind and practising the perfections. He also compiled the Shiksasamuccaya, an anthology of Mahayana sutra passages with commentary.
  significance: Shantideva gives the most penetrating Buddhist first-person account of weakness of will, self-cherishing and the sources of suffering, and his bodhisattva ideal is the Mahayana picture of human greatness. He is used chiefly for ethics.
  keyIdeas:
    - Bodhicitta (awakening mind)
    - The precious human birth
    - Afflictions as inner enemies
    - Patience grounded in conditionality
    - Equalising and exchanging self and other
  representativeWorks:
    - { title: Bodhicaryavatara, sourceId: shantideva-bodhicaryavatara }
    - { title: Shiksasamuccaya }

- id: dogen
  slug: dogen
  name: Dogen
  worldview: buddhism
  role: specialist
  displayOrder: 2
  usedFor: [Zen practice, time and enlightenment]
  schools: [Soto Zen]
  birthYear: 1200
  deathYear: 1253
  description: Japanese Zen master who founded the Soto school in Japan and wrote on practice, time and enlightenment.
  bio: >-
    Dogen (Dōgen, 1200–1253) was a Japanese Buddhist monk who founded the Soto school of Zen in Japan, one of the two Zen traditions still flourishing there. He studied Chan in Song China before returning to Japan to teach. His major work is the Shobogenzo, a collection of essays in Japanese on practice, time and Buddha-nature, written over many years. He taught shikantaza, "just sitting", as the expression of an enlightenment already present, and developed concepts such as practice-realisation and being-time.
  significance: Dogen gives a non-substantialist account of Buddha-nature and the unity of practice and realisation, and a distinctive reading of the gap between knowing and doing the good. He is used for questions of practice, time and the nature of awakening.
  keyIdeas:
    - Shushō ittō (practice-realisation as one)
    - Shikantaza (just sitting)
    - Entire being as Buddha-nature
    - Uji (being-time)
    - Study of the self as forgetting the self
  representativeWorks:
    - { title: Shobogenzo, sourceId: dogen-shobogenzo }
    - { title: Bendowa }

- id: tsongkhapa
  slug: tsongkhapa
  name: Tsongkhapa
  worldview: buddhism
  role: primary
  displayOrder: 5
  schools: [Gelug, Tibetan Madhyamaka]
  birthYear: 1357
  deathYear: 1419
  description: Tibetan scholar and founder of the Gelug school, known for his systematic presentation of the path and of Madhyamaka.
  bio: >-
    Tsongkhapa (1357–1419) was born in Tsongkha in the Amdo region of eastern Tibet and studied at major monastic centres in Central Tibet. He founded Ganden Monastery in 1409, which became the base of the Gelug school. His major works include the Great Treatise on the Stages of the Path (Lamrim Chenmo, 1402), the Essence of Eloquence (1407), the Ocean of Reasoning (1408) and Illuminating the Intent (1418). He championed the Prasangika-Madhyamaka reading of Nagarjuna, arguing that emptiness and dependent origination are compatible and that things function conventionally though lacking intrinsic nature.
  significance: Tsongkhapa integrates the value of human life, renunciation, compassion and the view of emptiness into one graded path, so that the ethical person remains conventionally real. He represents the Tibetan synthesis in the Buddhist lane.
  keyIdeas:
    - Lamrim (stages of the path)
    - Freedoms and advantages of human life
    - Three principal aspects of the path
    - Identifying the object of negation
    - Emptiness compatible with dependent origination
  representativeWorks:
    - { title: Lamrim Chenmo, year: 1402 }
    - { title: Three Principal Aspects of the Path, sourceId: tsongkhapa-three-principal-aspects }
    - { title: Legs bshad snying po (Essence of Eloquence), year: 1407 }
    - { title: Rigs pa'i rgya mtsho (Ocean of Reasoning), year: 1408 }

- id: fazang
  slug: fazang
  name: Fazang
  worldview: buddhism
  role: specialist
  displayOrder: 4
  usedFor: [Huayan metaphysics, the one and the many]
  schools: [Huayan]
  birthYear: 643
  deathYear: 712
  description: Chinese Buddhist scholar-monk, counted the third patriarch of the Huayan school, who systematized its teaching that all phenomena interpenetrate.
  bio: >-
    Fazang (643–712) was born in the Tang capital Chang'an to a family of Sogdian descent. As a young monk he assisted Xuanzang's translation work, then became a disciple of Zhiyan, later counted the second patriarch of the Huayan school, probably around 663. He won the favour of Empress Wu, lectured widely on the Avatamsaka (Flower Garland) Sutra, and wrote standard commentaries on it and on the Awakening of Faith in Mahayana. His Treatise on the Five Teachings of Huayan and his short Essay on the Golden Lion set out the school's doctrine that each phenomenon includes and is included in all others, illustrated by the rafter and the building and by Indra's net.
  significance: Fazang supplies the classic Buddhist account of how the one and the many are related, in which each thing contains all things without losing its own place. He is used for that question as a distinct Chinese Mahayana school, not as the voice of Buddhism generally.
  keyIdeas:
    - Mutual inclusion and identity of phenomena
    - Principle (li) and phenomena (shi) without obstruction
    - Indra's net
    - Six characteristics (the rafter and the building)
    - Classification of teachings (panjiao)
  representativeWorks:
    - { title: Essay on the Golden Lion, sourceId: fazang-golden-lion-cbeta }
    - { title: Treatise on the Five Teachings of Huayan }
    - { title: Commentary on the Awakening of Faith in Mahayana }

- id: dharmakirti
  slug: dharmakirti
  name: Dharmakirti
  worldview: buddhism
  role: primary
  displayOrder: 4
  schools: [Buddhist epistemology, Yogacara-Sautrantika]
  era: c. 6th–7th century CE (often c. 600–660; some scholars earlier)
  description: Buddhist logician and epistemologist whose work on valid cognition became the basis of Buddhist philosophy of knowledge in India and Tibet.
  bio: >-
    Dharmakirti (Dharmakīrti) lived in the sixth or seventh century CE; most evidence suggests activity around 600–660, though some scholars argue for a date half a century earlier. He is said to have been born in South India and to have moved to Nalanda monastery. With his predecessor Dignaga he founded the Buddhist epistemological school, known in Tibetan as "those who follow reasoning". He composed seven treatises, of which the Pramanavarttika, a commentary on Dignaga's Pramanasamuccaya, is the most significant; others include the Pramanaviniscaya, Nyayabindu and Hetubindu. His thought combines nominalism about universals, momentariness and a causal account of knowledge, and he debated non-Buddhist rivals, among them the Mimamsa tradition.
  significance: Dharmakirti argues that faults stem from a single defeasible cognition, the self-view, and that liberation is therefore rationally possible. He is the project's main Buddhist voice on knowledge and truth, and is set against Kumarila.
  keyIdeas:
    - Pramāṇa (valid cognition)
    - Perception and inference as the two means of knowledge
    - Nominalism about universals
    - Momentariness and causal efficacy
    - Self-view as root of attachment and hatred
    - Luminous mind and adventitious stains
  representativeWorks:
    - { title: Pramanavarttika }
    - { title: Pramanaviniscaya }
    - { title: Nyayabindu }
    - { title: Hetubindu }
  notes: Represents Buddhist logic and epistemology, central to the Knowledge & Truth domain.

- id: shinran
  slug: shinran
  name: Shinran
  worldview: buddhism
  role: specialist
  displayOrder: 3
  usedFor: [Pure Land devotion, Other Power, entrusting]
  schools: [Jōdo Shinshū (True Pure Land)]
  birthYear: 1173
  deathYear: 1263
  description: Japanese Pure Land teacher, regarded as the founder of Jōdo Shinshū, who taught complete reliance on Amida Buddha's vow rather than on one's own power.
  bio: >-
    Shinran (1173–1263) trained for about twenty years as a Tendai monk on Mount Hiei before
    becoming a disciple of Hōnen, who taught exclusive reliance on the recitation of Amida Buddha's
    name. When the nembutsu movement was suppressed in 1207 he was laicized and exiled to Echigo,
    where he married and lived as neither monk nor layman. He later taught in the Kantō region and
    returned to Kyoto in his last decades. His major work is the Kyōgyōshinshō; the Tannishō, a
    record of his sayings compiled after his death by his follower Yuien, is the most widely read
    account of his teaching. Jōdo Shinshū, the school that regards him as founder, became one of the
    largest Buddhist traditions in Japan.
  significance: >-
    Shinran gives the sharpest Buddhist statement of liberation through another's power: entrusting
    oneself to Amida's vow, which was made above all for those unable to free themselves. He is used
    for Pure Land devotion and for the comparison with grace, not as a representative of Buddhism as
    a whole.
  keyIdeas:
    - Other Power (tariki) versus self-power (jiriki)
    - Entrusting (shinjin) to Amida's vow
    - The nembutsu as the vow's working, not a meritorious act
    - Amida's vow made for the evil person
  representativeWorks:
    - { title: Kyōgyōshinshō }
    - { title: Tannishō (compiled by Yuien), sourceId: shinran-tannisho-cws }
