# --- Naturalistic atheism ----------------------------------------------------------------
- id: hume
  slug: david-hume
  name: David Hume
  worldview: naturalism
  role: primary
  displayOrder: 1
  schools: [Empiricism, Scottish Enlightenment]
  birthYear: 1711
  deathYear: 1776
  description: Scottish philosopher and a major historical critic of natural theology, causation and induction.
  bio: >-
    David Hume (1711–1776) was born in Edinburgh and educated at the university there, then
    worked on his first major book in France, where he lived from 1734. A Treatise of Human Nature
    (1739–40) was followed by the two Enquiries (1748, 1751), political and moral essays and a
    six-volume History of England (1754–62). He was refused academic posts at Edinburgh and
    Glasgow, and earned his living as a librarian and in diplomatic service. An empiricist and
    a central figure of the Scottish Enlightenment, he proposed a science of human nature built on
    experience and observation. His Dialogues Concerning Natural Religion appeared posthumously
    in 1779.
  significance: >-
    Hume is the classic naturalistic anatomy of human nature as a mix of benevolence and self-love,
    with morality grounded in sentiment and sympathy rather than reason alone. He supplies the
    historical form of the naturalist answer to why people are both good and bad, and he is also
    used on the site as a historical critic of natural theology.
  keyIdeas:
    - Reason as servant of the passions
    - Moral distinctions from sentiment
    - Sympathy and the common point of view
    - Justice as an artificial virtue
    - Compatibilist liberty
    - Uniformity of human nature
  representativeWorks:
    - { title: A Treatise of Human Nature, year: 1739, sourceId: hume-treatise }
    - { title: An Enquiry Concerning Human Understanding, year: 1748, sourceId: hume-enquiry }
    - { title: An Enquiry Concerning the Principles of Morals, year: 1751, sourceId: hume-epm }
    - { title: Dialogues Concerning Natural Religion, year: 1779 }
  notes: Hume was not an atheist in a simple sense; he is included as a historical critic of natural theology. The Treatise year is that of Books 1–2; Book 3 followed in 1740.

- id: russell
  slug: bertrand-russell
  name: Bertrand Russell
  worldview: naturalism
  role: primary
  displayOrder: 2
  schools: [Analytic philosophy]
  birthYear: 1872
  deathYear: 1970
  description: British philosopher and logician who argued against religious belief on philosophical and moral grounds.
  bio: >-
    Bertrand Russell (1872–1970) was born in Trellech, Monmouthshire, into the British
    aristocracy and educated at Trinity College, Cambridge, where he later became a Fellow and
    lecturer. With A. N. Whitehead he wrote Principia Mathematica (1910–13), and he was a founder
    of twentieth-century analytic philosophy. He was also a prominent public intellectual:
    imprisoned for pacifist activity in the First World War, an advocate of nuclear disarmament,
    and the author of many popular works on religion, ethics and politics. He was awarded the
    Nobel Prize in Literature in 1950.
  significance: >-
    Russell supplies a humanist framing of man as a product of purposeless causes who nonetheless
    creates value through desire and love, with a sober, gradual remedy: knowledge, self-control
    and sympathy. He is used for that stance toward human greatness and misery, not as the sole
    voice of naturalism.
  keyIdeas:
    - Man as product of purposeless causes
    - Value created by human desire and love
    - The good life inspired by love and guided by knowledge
    - No short cut to the good life
    - Refusal to worship power
  representativeWorks:
    - { title: The Problems of Philosophy, year: 1912 }
    - { title: Mysticism and Logic, year: 1918 }
    - { title: What I Believe, year: 1925, sourceId: russell-what-i-believe }
    - { title: Why I Am Not a Christian, year: 1927 }
  notes: Mysticism and Logic reprints "A Free Man's Worship" (first published 1903).

- id: mackie
  slug: j-l-mackie
  name: J. L. Mackie
  worldview: naturalism
  role: primary
  displayOrder: 3
  schools: [Analytic philosophy, Moral error theory]
  birthYear: 1917
  deathYear: 1981
  description: Australian philosopher known for the logical argument from evil and for his error theory of morality.
  bio: >-
    John Leslie Mackie (1917–1981) was an Australian philosopher who held posts in Australia,
    New Zealand and England and ended his career at University College, Oxford. A leading figure in
    analytic philosophy, he wrote on causation, ethics and the philosophy of religion. His book Ethics:
    Inventing Right and Wrong (1977) opens with the claim that there are no objective values and
    defends a moral error theory. The Miracle of Theism, an influential atheist critique of arguments
    for God, was published after his death, in 1982.
  significance: >-
    Mackie represents the naturalist view that morality is a human device for counteracting
    limited sympathies, and that its apparent objectivity is projected onto the world. He thus
    states the sharpest naturalist alternative to the Christian claim that human dignity and moral
    law are grounded in God.
  keyIdeas:
    - No objective values
    - Argument from queerness
    - Objectification of moral attitudes
    - Morality as a device to counteract limited sympathies
    - Logical problem of evil
  representativeWorks:
    - { title: "Ethics: Inventing Right and Wrong", year: 1977, sourceId: mackie-ethics }
    - { title: The Miracle of Theism, year: 1982 }
  notes: Mackie's moral error theory is not shared by all naturalists.

- id: dennett
  slug: daniel-dennett
  name: Daniel Dennett
  worldview: naturalism
  role: primary
  displayOrder: 4
  schools: [Philosophy of mind, Evolutionary naturalism]
  birthYear: 1942
  deathYear: 2024
  description: American philosopher who defended a naturalistic account of mind, consciousness and religion.
  bio: >-
    Daniel Dennett (1942–2024) was an American philosopher. After a bachelor's degree at Harvard, he
    completed his doctoral work at Oxford, and from 1971 until his retirement at the end of 2022 he
    taught at Tufts University, where he directed the Center for Cognitive Studies. Working in
    philosophy of mind, cognitive science and evolutionary biology, he developed the intentional
    stance and a naturalistic theory of consciousness, and defended a compatibilist account of free
    will in evolutionary terms. He also wrote on religion as a natural phenomenon and was a prominent
    public advocate of atheism and secular thought. He died in Portland, Maine.
  significance: >-
    Dennett gives a naturalist account of agency and responsibility that keeps persons, reasons and
    selves real while explaining them as products of evolution and culture. He is used on the
    question of what human capacities for deliberation and responsibility are, and how a naturalist
    can speak of moral accountability.
  keyIdeas:
    - Intentional stance
    - Self as center of narrative gravity
    - Reasons-giving as a distinctively human layer of control
    - Free will worth wanting
    - Competence without comprehension
    - Cultural evolution
  representativeWorks:
    - { title: Consciousness Explained, year: 1991 }
    - { title: Freedom Evolves, year: 2003 }
    - { title: "The Self as a Responding and Responsible Artifact", year: 2003, sourceId: dennett-self-artifact }
    - { title: "Breaking the Spell: Religion as a Natural Phenomenon", year: 2006 }

