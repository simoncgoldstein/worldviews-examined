# Source registry. Each work is registered once and cited many times with different
# locators via <Cite source="…" locator="…" />.
#
# Editorial hierarchy
#   A worldview's own account: canonical/primary texts -> major thinkers within the tradition
#     -> recognized internal institutions or scholars -> high-quality academic scholarship.
#     Christian polemical sources are never the primary evidence for what another worldview believes.
#   The Christian response: Scripture -> Westminster Standards (where directly relevant)
#     -> major Reformed theologians -> Van Til/Bahnsen on apologetic method -> reliable
#     historical and philosophical scholarship.
#
# Seed entries were registered to prove the architecture; entries from the "great-and-terrible"
# research round were verified 2026-10-05. A source is "checked" only when it meets all four
# conditions of the Verification protocol in docs/SOURCES.md (metadata, URL, locator convention,
# every cited passage read); notes records how. Anything else stays "unverified" (the default) and
# says what is missing. Reviewed and complete answers may cite only checked sources.

# --- Reformed Christianity -----------------------------------------------------------
