- id: soyen-shaku-sermons
  type: primary
  title: "Sermons of a Buddhist Abbot: Addresses on Religious Subjects"
  shortCitation: Soyen Shaku, Sermons
  author: Soyen Shaku
  translator: Daisetz Teitaro Suzuki
  traditionTags:
  - buddhism
  place: Chicago
  publisher: Open Court
  year: 1906
  url: https://archive.org/details/sermonsbuddhist00shak
  notes: >-
    Public domain; cite by sermon and page. Read 2026-10-07: "The God-Conception of Buddhism" (pp. 25-26, 83-84: Buddhism
    has a "God" in the Dharmakaya sense, not a personal creator; Jesus Christ among its "highest manifestations"); "Reply
    to a Christian Critic" (pp. 123-125: the Dharmakaya "incarnated" in Gautama and in all great men, "foremost among them
    in Jesus Christ"; miracles "irrelevant"; Jesus "the greatest master and teacher that appeared in the West after
    Buddha", but lacking the Buddha's calm). Rinzai Zen abbot of Engakuji.
  verificationStatus: checked
  verifiedOn: '2026-10-07'
- id: cobb-review-good-heart
  type: article
  title: "Review of the Dalai Lama, The Good Heart: A Buddhist Perspective on the Teachings of Jesus"
  shortCitation: Cobb, review of The Good Heart
  author: John B. Cobb Jr.
  traditionTags:
  - buddhism
  containerTitle: Journal of Ecumenical Studies 34.4
  year: 1997
  url: https://buddhism.lib.ntu.edu.tw/FULLTEXT/JR-EPT/cobb.htm
  notes: >-
    p. 580; read 2026-10-07 in the National Taiwan University Buddhist digital library. Quotes the Dalai Lama (John Main
    Seminar 1994; The Good Heart, pp. 82-83): Jesus "a fully enlightened being or a bodhisattva"; interdependence leaves
    "almost impossible" room for an eternal absolute or "a divine Creation". Cobb notes that history matters far more to
    the Bible than to Buddhist scriptures. Cite the Dalai Lama "as quoted in Cobb".
  verificationStatus: checked
  verifiedOn: '2026-10-07'
