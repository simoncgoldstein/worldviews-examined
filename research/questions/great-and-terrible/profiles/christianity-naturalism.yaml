# --- Reformed Christianity (and antecedent) ----------------------------------------------
- id: augustine
  slug: augustine-of-hippo
  name: Augustine of Hippo
  worldview: christianity
  role: primary
  displayOrder: 1
  schools: [Patristic theology, Augustinian tradition]
  birthYear: 354
  deathYear: 430
  description: North African bishop and theologian whose work on will, grace, evil, the two cities and history is foundational to Reformed anthropology and soteriology.
  bio: >-
    Augustine (354–430) was born at Thagaste in Roman North Africa. Trained in rhetoric, he
    taught in Carthage, Rome and Milan and passed through Manichaeism and Neoplatonism before
    turning to Christianity in 386; he was baptised by Ambrose at Easter 387. He was ordained a
    priest at Hippo Regius in 391, became its bishop around 396, and served there until his death
    during the Vandal siege in 430. His Confessions examine his own will and loves before God, and
    The City of God, begun in 412, interprets history as the interplay of two loves. His
    controversies with the Manichees, Donatists and Pelagians shaped Western Latin teaching on
    evil, sin and grace.
  significance: >-
    For the question "Why is man so great and so terrible?", Augustine supplies much of the
    conceptual vocabulary the Reformed answer inherits: evil as privation, pride and disordered
    love, the divided will, and human gifts coexisting with misery. He is a primary Christian
    antecedent of the Reformed tradition, not himself a Reformed theologian.
  keyIdeas:
    - Evil as privation of good
    - Pride and disordered love
    - Two loves and two cities
    - The divided will and the chain of habit
    - Grace as remedy for a bound will
  representativeWorks:
    - { title: Confessions, year: 400, sourceId: augustine-confessions }
    - { title: The City of God, year: 426, sourceId: augustine-city-of-god }
  notes: Included as a primary Christian antecedent of the Reformed tradition, not as a Reformed theologian. Confessions is dated ca. 396–400 and The City of God 412–426; the year given is the completion date.

- id: calvin
  slug: john-calvin
  name: John Calvin
  worldview: christianity
  role: primary
  displayOrder: 2
  schools: [Reformed theology]
  birthYear: 1509
  deathYear: 1564
  description: Reformer of Geneva whose Institutes of the Christian Religion shaped Reformed doctrine, notably on the knowledge of God, the image of God, the fall and providence.
  bio: >-
    John Calvin (1509–1564) was born at Noyon in Picardy and studied in Paris and then law at
    Orléans and Bourges, before committing himself to the Protestant Reformation in the early
    1530s. The first edition of his Institutes of the Christian Religion appeared at Basel in 1536.
    He ministered in Geneva from 1536 until his expulsion in 1538, spent three years in
    Strasbourg, and returned to Geneva in 1541, where he remained as pastor, preacher, teacher and
    commentator until his death. He revised the Institutes repeatedly; the definitive Latin
    edition of 1559 became the most influential systematic statement of Reformed doctrine.
  significance: >-
    Calvin supplies the classic Reformed account of humanity as a ruined image: created excellence,
    corrupted natural gifts, withdrawn supernatural gifts, and a restraint of sin that leaves room
    for real human achievement. His treatment in Institutes II.1–3 is a principal source for the
    Christian answer to why people are both great and terrible.
  keyIdeas:
    - Knowledge of God and of ourselves
    - Image of God as marred but not destroyed
    - Natural gifts corrupted, supernatural gifts lost
    - God's restraint of sin and the gifts of the Spirit to unbelievers
    - Necessity without compulsion
  representativeWorks:
    - { title: Institutes of the Christian Religion, year: 1559, sourceId: calvin-institutes-beveridge }
    - { title: Commentary on Romans, year: 1540, sourceId: calvin-commentary-romans }

- id: witsius
  slug: herman-witsius
  name: Herman Witsius
  worldview: christianity
  role: primary
  displayOrder: 4
  schools: [Reformed covenant theology]
  birthYear: 1636
  deathYear: 1708
  description: Dutch Reformed theologian whose systematic treatment of the covenants shaped Reformed covenant theology.
  bio: >-
    Herman Witsius (1636–1708) was born at Enkhuizen in the Dutch Republic. After studying at
    Groningen, Utrecht and Leiden he served as a pastor in several towns, then held professorships
    of divinity at Franeker (1675), Utrecht (1680) and Leiden (1698), where he died. His chief
    work, De oeconomia foederum Dei cum hominibus (Leeuwarden, 1677; English translation as The
    Economy of the Covenants between God and Man), set out Reformed covenant theology in a
    systematic form. Writing amid the Voetian and Cocceian controversies in the Dutch church, he
    tried to mediate between the parties, and was not fully accepted by either.
  significance: >-
    Witsius states federal headship, the imputation of Adam's first sin and the Adam–Christ parallel
    of Romans 5 in classic Reformed covenantal form. This is the confessional explanation for the
    universality of human corruption, and he is used on that point rather than as a general
    spokesman for the tradition.
  keyIdeas:
    - Covenant of works with Adam as head
    - Imputation of Adam's first sin
    - Adam as type of Christ
    - Covenant of grace
    - Mediation between Voetians and Cocceians
  representativeWorks:
    - { title: The Economy of the Covenants between God and Man, year: 1677, sourceId: witsius-economy-covenants }
  notes: Original Latin title De oeconomia foederum Dei cum hominibus; the year is that of the Latin first edition.

- id: edwards
  slug: jonathan-edwards
  name: Jonathan Edwards
  worldview: christianity
  role: specialist
  displayOrder: 1
  usedFor: [affections, will, beauty, desire, religious experience]
  schools: [New England Reformed theology]
  birthYear: 1703
  deathYear: 1758
  description: American theologian and philosopher whose analyses of the affections, the will and the beauty of God have been influential in Reformed thought.
  bio: >-
    Jonathan Edwards (1703–1758) was born at East Windsor, Connecticut, and educated at Yale,
    where he later served as a tutor. From the mid-1720s he was a minister at Northampton,
    Massachusetts, and a leading figure in the revivals of the 1730s and 1740s. Dismissed by his
    congregation in 1750, he worked as a missionary and pastor at Stockbridge until 1757, when he
    was called to the presidency of the College of New Jersey (Princeton); he died in March 1758
    after a smallpox inoculation. Working in the New England Puritan Reformed tradition, he wrote
    on religious experience, freedom of the will, original sin and virtue, combining Reformed
    theology with philosophical argument.
  significance: >-
    Edwards explains how a person can approve the good yet be morally unable to will it, and why
    natural pity, gratitude and conscience can restrain vice without amounting to true virtue.
    He is used for the moral psychology of the Reformed account, not as a general spokesman for
    the tradition.
  keyIdeas:
    - Natural versus moral inability
    - The will follows the strongest motive
    - True virtue as benevolence to being in general
    - Natural conscience distinct from true virtue
    - Religious affections
    - Original sin inferred from a universal tendency
  representativeWorks:
    - { title: A Treatise Concerning Religious Affections, year: 1746 }
    - { title: Freedom of the Will, year: 1754, sourceId: edwards-works-hickman-1 }
    - { title: Original Sin, year: 1758, sourceId: edwards-works-hickman-1 }
    - { title: The Nature of True Virtue, year: 1765, sourceId: edwards-works-hickman-1 }
  notes: The Nature of True Virtue was written in the 1750s and published posthumously in 1765. Freedom of the Will and Original Sin are the usual short titles of longer original titles.

- id: bavinck
  slug: herman-bavinck
  name: Herman Bavinck
  worldview: christianity
  role: primary
  displayOrder: 5
  schools: [Dutch Reformed theology]
  birthYear: 1854
  deathYear: 1921
  description: Dutch Reformed theologian who treated revelation, religion, anthropology and modernity within a single dogmatic system.
  bio: >-
    Herman Bavinck (1854–1921) was born at Hoogeveen in the Netherlands. He studied briefly at
    Kampen and then at Leiden, completing a doctorate on the ethics of Zwingli in 1880. He taught
    dogmatics at the Theological School at Kampen and in 1902 moved to the Free University of
    Amsterdam, where he succeeded Abraham Kuyper. His four-volume Gereformeerde Dogmatiek
    (1895–1901) is the major systematic work of Dutch neo-Calvinism, and he also wrote on ethics,
    education and psychology and took part in Dutch public life, serving in the Senate from 1911.
    He delivered the Stone Lectures at Princeton in 1908.
  significance: >-
    Bavinck interprets Calvin's doctrine of common grace as the Reformed explanation of how human
    culture, arts and sciences flourish outside the church despite the fall. He is used mainly for
    this account of the gifts and restraint that coexist with sin, not as a spokesman for the whole
    tradition.
  keyIdeas:
    - Grace restores nature
    - Common grace restrains sin and preserves creation
    - Arts and sciences as gifts of the Spirit
    - Remnants of the image of God in human gifts
    - Organic unity in diversity
  representativeWorks:
    - { title: Reformed Dogmatics (Gereformeerde Dogmatiek), year: 1895, sourceId: bavinck-reformed-dogmatics }
    - { title: Calvin and Common Grace, year: 1909, sourceId: bavinck-calvin-common-grace }
  notes: Reformed Dogmatics appeared in Dutch in four volumes, 1895–1901 (English translation 2003–2008); the year field gives the first volume. His start date at Kampen is disputed (1881 or 1883) and is omitted.

- id: van-til
  slug: cornelius-van-til
  name: Cornelius Van Til
  worldview: christianity
  role: primary
  displayOrder: 7
  schools: [Presuppositional apologetics]
  birthYear: 1895
  deathYear: 1987
  description: Reformed apologist who developed the Creator-creature distinction, analogical knowledge and the transcendental method into a distinctive apologetic.
  bio: >-
    Cornelius Van Til (1895–1987) was born at Grootegast in the Netherlands and emigrated with his
    family to the United States as a boy, settling at Highland, Indiana. After studying at Calvin
    College (graduating 1922) and Princeton Theological Seminary, he took a doctorate in
    philosophy at Princeton University in 1927. From 1929 until his retirement in 1972 he taught
    apologetics at Westminster Theological Seminary near Philadelphia, where he was a member of
    the original faculty, and he continued to teach part-time into 1979. Working within the
    Reformed tradition and drawing on Kuyper, Bavinck and others, he developed an apologetic
    grounded in the Creator-creature distinction, and became the best-known proponent of what
    came to be called presuppositional apologetics.
  significance: >-
    Van Til matters to this site for the Creator-creature distinction, analogical knowledge,
    antithesis, transcendental apologetics and the denial of religious neutrality. He supplies the
    method by which Reformed answers are argued against rival worldviews, rather than evidence on
    the question of human greatness and misery itself.
  keyIdeas:
    - Creator-creature distinction
    - Analogical knowledge
    - Antithesis
    - Transcendental argument
    - No brute facts
    - Denial of religious neutrality
  representativeWorks:
    - { title: The Defense of the Faith, year: 1955, sourceId: van-til-defense }

# --- Naturalistic atheism ----------------------------------------------------------------
- id: hume
  slug: david-hume
  name: David Hume
  worldview: naturalism
  role: primary
  displayOrder: 1
  schools: [Empiricism, Scottish Enlightenment]
  birthYear: 1711
  deathYear: 1776
  description: Scottish philosopher and a major historical critic of natural theology, causation and induction.
  bio: >-
    David Hume (1711–1776) was born in Edinburgh and educated at the university there, then
    worked on his first major book in France, where he lived from 1734. A Treatise of Human Nature
    (1739–40) was followed by the two Enquiries (1748, 1751), political and moral essays and a
    six-volume History of England (1754–62). He was refused academic posts at Edinburgh and
    Glasgow, and earned his living as a librarian and in diplomatic service. An empiricist and
    a central figure of the Scottish Enlightenment, he proposed a science of human nature built on
    experience and observation. His Dialogues Concerning Natural Religion appeared posthumously
    in 1779.
  significance: >-
    Hume is the classic naturalistic anatomy of human nature as a mix of benevolence and self-love,
    with morality grounded in sentiment and sympathy rather than reason alone. He supplies the
    historical form of the naturalist answer to why people are both good and bad, and he is also
    used on the site as a historical critic of natural theology.
  keyIdeas:
    - Reason as servant of the passions
    - Moral distinctions from sentiment
    - Sympathy and the common point of view
    - Justice as an artificial virtue
    - Compatibilist liberty
    - Uniformity of human nature
  representativeWorks:
    - { title: A Treatise of Human Nature, year: 1739, sourceId: hume-treatise }
    - { title: An Enquiry Concerning Human Understanding, year: 1748, sourceId: hume-enquiry }
    - { title: An Enquiry Concerning the Principles of Morals, year: 1751, sourceId: hume-epm }
    - { title: Dialogues Concerning Natural Religion, year: 1779 }
  notes: Hume was not an atheist in a simple sense; he is included as a historical critic of natural theology. The Treatise year is that of Books 1–2; Book 3 followed in 1740.

- id: russell
  slug: bertrand-russell
  name: Bertrand Russell
  worldview: naturalism
  role: primary
  displayOrder: 2
  schools: [Analytic philosophy]
  birthYear: 1872
  deathYear: 1970
  description: British philosopher and logician who argued against religious belief on philosophical and moral grounds.
  bio: >-
    Bertrand Russell (1872–1970) was born in Trellech, Monmouthshire, into the British
    aristocracy and educated at Trinity College, Cambridge, where he later became a Fellow and
    lecturer. With A. N. Whitehead he wrote Principia Mathematica (1910–13), and he was a founder
    of twentieth-century analytic philosophy. He was also a prominent public intellectual:
    imprisoned for pacifist activity in the First World War, an advocate of nuclear disarmament,
    and the author of many popular works on religion, ethics and politics. He was awarded the
    Nobel Prize in Literature in 1950.
  significance: >-
    Russell supplies a humanist framing of man as a product of purposeless causes who nonetheless
    creates value through desire and love, with a sober, gradual remedy: knowledge, self-control
    and sympathy. He is used for that stance toward human greatness and misery, not as the sole
    voice of naturalism.
  keyIdeas:
    - Man as product of purposeless causes
    - Value created by human desire and love
    - The good life inspired by love and guided by knowledge
    - No short cut to the good life
    - Refusal to worship power
  representativeWorks:
    - { title: The Problems of Philosophy, year: 1912 }
    - { title: Mysticism and Logic, year: 1918, sourceId: russell-mysticism-logic }
    - { title: What I Believe, year: 1925, sourceId: russell-what-i-believe }
    - { title: Why I Am Not a Christian, year: 1927 }
  notes: Mysticism and Logic reprints "A Free Man's Worship" (first published 1903).

- id: mackie
  slug: j-l-mackie
  name: J. L. Mackie
  worldview: naturalism
  role: primary
  displayOrder: 3
  schools: [Analytic philosophy, Moral error theory]
  birthYear: 1917
  deathYear: 1981
  description: Australian philosopher known for the logical argument from evil and for his error theory of morality.
  bio: >-
    John Leslie Mackie (1917–1981) was born in Sydney and educated at the University of Sydney and
    at Oxford. He taught at the universities of Otago, Sydney and York, and from 1967 was a
    Fellow of University College, Oxford; he was elected a Fellow of the British Academy in
    1974. A leading figure in Australian and British analytic philosophy, he wrote on causation,
    ethics and the philosophy of religion. His book Ethics: Inventing Right and Wrong (1977)
    defended a moral error theory, and The Miracle of Theism (1982), published after his death,
    gave an influential atheist critique of arguments for God.
  significance: >-
    Mackie represents the naturalist view that morality is a human device for counteracting
    limited sympathies, and that its apparent objectivity is projected onto the world. He thus
    states the sharpest naturalist alternative to the Christian claim that human dignity and moral
    law are grounded in God.
  keyIdeas:
    - No objective values
    - Argument from queerness
    - Objectification of moral attitudes
    - Morality as a device to counteract limited sympathies
    - Logical problem of evil
  representativeWorks:
    - { title: "Ethics: Inventing Right and Wrong", year: 1977, sourceId: mackie-ethics }
    - { title: The Miracle of Theism, year: 1982 }
  notes: Mackie's moral error theory is not shared by all naturalists.

- id: dennett
  slug: daniel-dennett
  name: Daniel Dennett
  worldview: naturalism
  role: primary
  displayOrder: 4
  schools: [Philosophy of mind, Evolutionary naturalism]
  birthYear: 1942
  deathYear: 2024
  description: American philosopher who defended a naturalistic account of mind, consciousness and religion.
  bio: >-
    Daniel Dennett (1942–2024) was an American philosopher. After a degree at Harvard, he took a
    doctorate at Oxford in 1965 under Gilbert Ryle, and for about five decades taught at Tufts
    University, where he co-directed the Center for Cognitive Studies. Working in philosophy of
    mind, cognitive science and evolutionary biology, he developed the intentional stance and a
    naturalistic theory of consciousness, and defended a compatibilist account of free will in
    evolutionary terms. He also wrote on religion as a natural phenomenon and was a prominent
    public advocate of atheism and secular thought. He died in Portland, Maine.
  significance: >-
    Dennett gives a naturalist account of agency and responsibility that keeps persons, reasons and
    selves real while explaining them as products of evolution and culture. He is used on the
    question of what human capacities for deliberation and responsibility are, and how a naturalist
    can speak of moral accountability.
  keyIdeas:
    - Intentional stance
    - Self as center of narrative gravity
    - Reasons-giving as a distinctively human layer of control
    - Free will worth wanting
    - Competence without comprehension
    - Cultural evolution
  representativeWorks:
    - { title: Consciousness Explained, year: 1991 }
    - { title: Freedom Evolves, year: 2003 }
    - { title: "The Self as a Responding and Responsible Artifact", year: 2003, sourceId: dennett-self-artifact }
    - { title: "Breaking the Spell: Religion as a Natural Phenomenon", year: 2006 }

- id: railton
  slug: peter-railton
  name: Peter Railton
  worldview: naturalism
  role: specialist
  displayOrder: 1
  usedFor: [ethics, naturalistic moral realism]
  schools: [Naturalistic moral realism]
  birthYear: 1950
  description: American philosopher associated with a naturalistic moral realism on which objective moral facts are part of the natural world.
  bio: >-
    Peter Railton (born 1950) is an American philosopher and the Gregory S. Kavka Distinguished
    University Professor at the University of Michigan, Ann Arbor, where he has taught since 1979.
    He took his doctorate at Princeton in 1980 under David Lewis. Working in metaethics and
    normative ethics, he is a leading defender of naturalistic moral realism, the view that moral
    facts are natural facts that can be investigated and learned about. His best-known paper
    "Moral Realism" appeared in the Philosophical Review in 1986, and his papers on ethics were
    collected in Facts, Values, and Norms (2003).
  significance: >-
    Railton shows that a naturalist can hold that cruelty and exclusion are objectively wrong and that
    moral learning tracks real facts, giving a naturalist account of both moral progress and moral
    failure. He is used for ethics, as a contrast with error theory, not as representative of all
    naturalists.
  keyIdeas:
    - Naturalistic moral realism
    - Good as idealized interests
    - Moral rightness as social rationality
    - Feedback between wants and interests
    - Moral progress without guarantee
  representativeWorks:
