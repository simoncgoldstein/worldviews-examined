- id: darwin
  slug: charles-darwin
  name: Charles Darwin
  worldview: naturalism
  role: specialist
  displayOrder: 4
  usedFor: [evolutionary origins of the moral sense, human nature]
  schools: [Evolutionary biology]
  birthYear: 1809
  deathYear: 1882
  description: English naturalist whose theory of evolution by natural selection, applied to humans in The Descent of Man, offers an account of the origin of the moral sense.
  bio: >-
    Charles Darwin (1809–1882) was born at Shrewsbury, England. He studied medicine at Edinburgh
    and then took a Cambridge degree at Christ's College, and from 1831 spent nearly five years as
    naturalist on HMS Beagle. He later lived at Down House in Kent. On the Origin of Species
    (1859) set out the theory of evolution by natural selection; The Descent of Man (1871)
    applied it to humans, treating mind, language and the moral sense as products of descent with
    modification, and The Expression of the Emotions in Man and Animals followed in 1872. He died at
    Downe and was buried in Westminster Abbey.
  significance: >-
    Darwin gives the founding evolutionary account of the moral sense as arising from social
    instincts joined to intellect, and so of how the same animal nature can produce both sympathy and
    cruelty. He is used for evolutionary anthropology, as the source of the explanation later
    naturalists build on.
  keyIdeas:
    - Moral sense from social instincts plus intellect
    - Conscience as backward-looking remorse
    - Sympathy limited to one's own group but extendable
    - Selection of social virtues among competing groups
    - Continuity of human and animal minds
  representativeWorks:
    - { title: On the Origin of Species, year: 1859 }
    - { title: "The Descent of Man, and Selection in Relation to Sex", year: 1871, sourceId: darwin-descent }
    - { title: The Expression of the Emotions in Man and Animals, year: 1872 }
  notes: Darwin described himself as an agnostic (letter to John Fordyce, 7 May 1879) and is used for evolutionary anthropology, not as a representative of atheism.

- id: kitcher
  slug: philip-kitcher
  name: Philip Kitcher
  worldview: naturalism
  role: specialist
  displayOrder: 5
  usedFor: [pragmatic naturalist ethics, evolution of ethics]
  schools: [Pragmatic naturalism, Philosophy of biology]
  birthYear: 1947
  description: British-born American philosopher of science who offers a pragmatist naturalist account of the origin and progress of ethics.
  bio: >-
    Philip Kitcher (born 1947) is a British-born American philosopher. He studied at Christ's
    College, Cambridge, and took a doctorate at Princeton in 1974. He taught at Vermont,
    Minnesota and the University of California, San Diego, before joining Columbia University,
    where he is John Dewey Professor of Philosophy Emeritus. Known first for work in the
    philosophy of science and biology, including critiques of creationism and sociobiology,
    he later turned to ethics and secular humanism, writing Living with Darwin (2007), The Ethical
    Project (2011) and Life After Faith (2014).
  significance: >-
    Kitcher gives the most developed philosophical naturalist account of the origin of ethics and of
    moral progress: humans are incomplete psychological altruists, and ethics is a social technology
    for remedying that failure. He answers the question about human goodness and badness with a
    pragmatic, non-theistic history of how morality was built and refined.
  keyIdeas:
    - Humans as incomplete psychological altruists
    - Altruism failures
    - Ethics as social technology
    - Moral progress as functional refinement
    - Pragmatist (Deweyan) naturalism
  representativeWorks:
    - { title: Living with Darwin, year: 2007 }
    - { title: The Ethical Project, year: 2011, sourceId: kitcher-ethical-project }
    - { title: Precis of The Ethical Project, year: 2012, sourceId: kitcher-ethical-project-precis }
    - { title: "Life After Faith: The Case for Secular Humanism", year: 2014 }
  notes: Represents one pragmatist form of naturalist ethics, not naturalism as a whole. His account of progress as functional refinement differs from moral realism (Railton) and error theory (Mackie).
