- id: saadia
  slug: saadia-gaon
  name: Saadia Gaon
  worldview: judaism
  role: primary
  displayOrder: 1
  schools: [Medieval Jewish rationalism, Geonic tradition]
  birthYear: 882
  deathYear: 942
  description: Head of the Sura academy who gave the first systematic philosophical defense of rabbinic Judaism.
  bio: >-
    Saadia ben Joseph (882-942) was born in the Fayyum in Egypt and worked in Palestine,
    Syria and Iraq. In 928 he was appointed gaon, or head, of the Sura academy in Babylonia,
    and he spent his later years in Baghdad, where he died. Writing in Arabic within the
    intellectual world of early Islamic kalam, he composed the Book of Beliefs and Opinions
    (completed 933), usually regarded as the first systematic work of Jewish philosophy. He
    also produced an Arabic translation of the Bible with commentary, a commentary on the Sefer
    Yetzirah, a prayer book, and works on grammar, law and the calendar. He defended rabbinic
    Judaism against Karaite and other critics.
  significance: >-
    Saadia supplies an early Jewish account of why humans, as the creatures endowed with wisdom, are commanded, judged
    and free, and so of both human dignity and accountability. On the site he also anchors the claim that reason and
    revelation are complementary sources of knowledge.
  keyIdeas:
    - Reason and revelation as joint sources of knowledge
    - Rational and revelational commandments
    - Humanity as the purpose and culmination of creation
    - Free choice without divine compulsion
    - Reward and punishment as just
  representativeWorks:
    - { title: "The Book of Beliefs and Opinions (Kitab al-Amanat wa-l-I'tiqadat; Emunot ve-De'ot)", year: 933, sourceId: saadia-emunot-ibn-tibbon }
    - { title: Arabic translation of the Torah (Tafsir) }
    - { title: Siddur (prayer book) }

- id: halevi
  slug: judah-halevi
  name: Judah Halevi
  worldview: judaism
  role: primary
  displayOrder: 2
  schools: [Medieval Jewish philosophy]
  era: c. 1075–1141
  deathYear: 1141
  description: Poet and philosopher who defended revealed religion and the particular vocation of Israel against philosophical rationalism.
  bio: >-
    Judah Halevi was born around 1075 in Toledo or Tudela in al-Andalus and was trained in
    Hebrew and Arabic learning. He lived in Muslim and Christian Spain, practiced medicine, and
    became one of the greatest Hebrew poets of the Middle Ages, writing secular verse, liturgical
    poems and poems of longing for Zion. His philosophical work, the Kuzari, is a dialogue
    between a king and a Jewish sage, written in Arabic and revised during the 1130s. It defends
    Judaism as grounded in public revelation and tradition, and criticizes Aristotelian
    philosophy. In 1140 he left Spain for Egypt, intending to reach the Land of Israel, and he
    died around 1141.
  significance: >-
    Halevi offers a hierarchy of natural, animal, rational and divine levels of existence and sees human excellence as
    ordered rather than suppressed desire under divine influence. He also provides a Jewish counterweight to
    Maimonidean rationalism.
  keyIdeas:
    - The divine influence (amr ilahi)
    - Tradition and public revelation over speculation
    - Degrees of being
    - The election of Israel and the Land
    - Ordered rather than suppressed desire
  representativeWorks:
    - { title: "The Kuzari (Kitab al-Hujja wa-l-Dalil fi Nusr al-Din al-Dhalil)", sourceId: halevi-kuzari-hirschfeld }
    - { title: Poems of Zion }
  notes: Birth place and year are approximate. Registry sourceId halevi-kuzari should be reconciled with halevi-kuzari-hirschfeld.

- id: maimonides
  slug: maimonides
  name: Moses Maimonides
  worldview: judaism
  role: primary
  displayOrder: 3
  schools: [Medieval Jewish rationalism, Halakhic codification]
  birthYear: 1138
  deathYear: 1204
  description: Physician, philosopher and codifier of Jewish law whose work joined rabbinic tradition with Aristotelian philosophy.
  bio: >-
    Moses ben Maimon (1138-1204), called Rambam, was born in Cordoba. His family left after the
    Almohad conquest and eventually settled in Fustat, Egypt, in 1166. He completed his
    Arabic Commentary on the Mishnah in 1168 and, around 1180, the Mishneh Torah, a
    comprehensive code of Jewish law in Hebrew. His philosophical masterpiece, the Guide of the
    Perplexed, was completed around 1190. He earned his living as a physician, later attached to
    the court of Saladin's vizier al-Qadi al-Fadil, and was recognized as head of the Fustat Jewish
    community. His authority was immense, and his thought was also contested from the start.
  significance: >-
    Maimonides gives the classic Jewish statements on free will, repentance, the divine image as intellect, the
    training of character, and the claim that most human evils are self-inflicted. He is the main medieval
    rationalist foil to Nachmanides on Eden and the origin of desire.
  keyIdeas:
    - Free choice as a foundation of Torah
    - Repentance (teshuvah) as cessation, regret, resolve and confession
    - The divine image as intellect
    - Most evils are self-inflicted
    - The ethical mean and the training of dispositions
  representativeWorks:
    - { title: Commentary on the Mishnah (including the Eight Chapters, Shemonah Perakim), year: 1168, sourceId: maimonides-eight-chapters }
    - { title: Mishneh Torah, year: 1180, sourceId: maimonides-mishneh-torah-touger }
    - { title: Guide of the Perplexed, year: 1190, sourceId: maimonides-guide-friedlander }
  notes: Birth year follows SEP (1138); some sources give 1135 or 1137. Mishneh Torah and Guide years are completion dates (the Guide's is sometimes given as c. 1185-1190). Registry sourceId maimonides-guide should be reconciled with maimonides-guide-friedlander.

- id: nachmanides
  slug: nachmanides
  name: Nachmanides (Moses ben Nahman)
  worldview: judaism
  role: primary
  displayOrder: 4
  schools: [Medieval Talmudic scholarship, Kabbalah]
  birthYear: 1194
  era: 1194–c. 1270
  description: Spanish Talmudist and biblical commentator who combined halakhic scholarship with mystical interpretation and defended Judaism in the Barcelona disputation.
  bio: >-
    Moses ben Nahman (1194-c. 1270), known as Nachmanides or the Ramban, was born in Girona in
    Catalonia, where he became a leading rabbi and Talmudist, and he was later regarded as the
    chief rabbi of Catalonia. He wrote novellae on the Talmud, legal works including Torat
    ha-Adam, and Milhamot ha-Shem, a defence of Alfasi against criticism. In 1263 he represented
    Judaism in the Barcelona Disputation against the convert Pablo Christiani. Forced to leave
    Spain, he emigrated to the Land of Israel in 1267 and died in Acre around 1270. His Torah
    commentary, completed late in life, joins plain-sense exegesis with Kabbalistic allusion.
  significance: >-
    Nachmanides reads the tree of knowledge as the origin of human will and desire, and the messianic healing of the
    heart as its remedy, the strongest medieval alternative to Maimonides on Eden. He gives the Jewish lane an
    account in which choice is both godlike and a burden.
  keyIdeas:
    - Original human nature acting naturally, as the heavens do
    - Choice as godlike yet burdensome
    - Divine assistance to the person who seeks purity
    - Messianic restoration of natural goodness
    - Kabbalistic layers within the plain sense of Torah
  representativeWorks:
    - { title: Commentary on the Torah, sourceId: ramban-torah-chavel }
    - { title: Torat ha-Adam }
    - { title: Milhamot ha-Shem }
    - { title: Sefer ha-Vikkuah (account of the 1263 disputation) }
  notes: Often critical of Maimonidean positions.

- id: soloveitchik
  slug: joseph-b-soloveitchik
  name: Joseph B. Soloveitchik
  worldview: judaism
  role: primary
  displayOrder: 5
  schools: [Modern Orthodox Judaism]
  birthYear: 1903
  deathYear: 1993
  description: Talmudist and philosopher who gave modern Orthodoxy a religious anthropology and an account of halakhic life.
  bio: >-
    Joseph Ber Soloveitchik (1903-1993) was born in Pruzhany, then in the Russian Empire, into
    a family of Lithuanian Talmudists of the Brisker tradition. He earned a doctorate at the
    University of Berlin in 1932 with a dissertation on the philosophy of Hermann Cohen. He
    emigrated to the United States and settled in Boston, where he founded the Maimonides School
    in 1937. From 1941 until 1986 he led the rabbinic training programme at Yeshiva University's
    RIETS, ordaining some two thousand rabbis. His essays, such as Halakhic Man and The Lonely
    Man of Faith, combine Talmudic method with neo-Kantian and existentialist philosophy. He
    died in Boston.
  significance: >-
    Soloveitchik offers a modern Jewish anthropology of two Adams, one majestic and creative, one covenantal and
    obedient, and grounds dignity in responsibility. He speaks directly to technology, creativity and civilization in
    this question.
  keyIdeas:
    - Adam the first and Adam the second
    - Dignity as responsibility
    - Majesty and covenant as complementary
    - Halakhic man as creator
    - Loneliness and the covenantal community
  representativeWorks:
    - { title: "Halakhic Man (Ish ha-Halakhah)", year: 1944, sourceId: soloveitchik-halakhic-man }
    - { title: The Lonely Man of Faith, year: 1965, sourceId: soloveitchik-lonely-man-of-faith }
    - { title: Kol Dodi Dofek, year: 1956 }
  notes: Years are those of first publication (Halakhic Man in Hebrew, 1944; English translation 1983).

- id: ash-ari
  slug: al-ashari
  name: Abu al-Hasan al-Ash'ari
  worldview: islam
  role: primary
  displayOrder: 1
  schools: [Ash'ari kalam]
  era: c. 873/4–935/6
  description: Theologian whose method gave rise to the Ash'ari school of Sunni kalam.
  bio: >-
    Abu al-Hasan 'Ali ibn Isma'il al-Ash'ari was born in Basra around 874 and died in Baghdad
    around 936. He studied under the Mu'tazili theologian al-Jubba'i and held Mu'tazili views
    until, around the age of forty, he broke with the school. Tradition attributes his change
    to dreams of the Prophet in Ramadan. He then defended the creed of the Sunni traditionists
    using the rational methods of kalam. His surviving writings include the Maqalat
    al-Islamiyyin, a survey of Muslim sects, the Kitab al-Luma', and the al-Ibana. His
    followers developed the Ash'ari school, which became dominant in Sunni theology.
  significance: >-
    Al-Ash'ari supplies the framework that al-Ghazali inherits: God creates all acts, humans "acquire" them (kasb), and
    moral obligation comes from revelation. The site uses him for the Sunni kalam view of will and responsibility.
  keyIdeas:
    - God's will and power extend to all events, including human acts
    - Acquisition (kasb) as the human relation to created acts
    - Obligation grounded in revelation, not in intrinsic moral properties
    - Divine attributes affirmed "without asking how"
    - Rational kalam used to defend scriptural doctrine
  representativeWorks:
    - { title: Maqalat al-Islamiyyin }
    - { title: Kitab al-Luma' }
    - { title: "al-Ibana 'an Usul al-Diyana (The Elucidation of Islam's Foundation)", sourceId: ashari-ibana-klein }
  notes: Dates are approximate. The authenticity of al-Ibana is questioned by some scholars.

- id: maturidi
  slug: al-maturidi
  name: Abu Mansur al-Maturidi
  worldview: islam
  role: primary
  displayOrder: 2
  schools: [Maturidi kalam]
  deathYear: 944
  description: Samarqand theologian and eponym of the Maturidi school of Sunni kalam.
  bio: >-
    Abu Mansur Muhammad al-Maturidi died in Samarqand in 944 (333 AH); his birth date is
    unknown. He came from Maturid, a district of Samarqand in Transoxiana, and belonged to the
    Hanafi legal tradition. His main works are the Kitab al-Tawhid, a systematic theological
    treatise, and the Ta'wilat, a large commentary on the Qur'an. He defended Sunni belief
    against Mu'tazili and other rivals using reasoned argument. Later scholars in
    Transoxiana and beyond built on his work, and the Maturidi school became the dominant
    theology among Hanafi Muslims, alongside the Ash'ari school.
  significance: >-
    Al-Maturidi represents the Hanafi-Maturidi strand, with greater confidence than the Ash'aris in reason's moral
    competence and in real human choice. He gives the Islamic lane a second, distinct Sunni account of freedom and
    responsibility.
  keyIdeas:
    - Knowing God is rationally obligatory
    - Reason can often know good and bad, though revelation is final
    - Human nature as natural constitution plus intellect
    - Real choice (ikhtiyar) within God's creation of acts
    - Divine wisdom (hikma) grounding the moral order
  representativeWorks:
    - { title: Kitab al-Tawhid }
    - { title: Ta'wilat (Qur'an commentary) }
  notes: Death date is firm; birth is unknown. Some modern sources give c. 852, which is not securely attested.

- id: ghazali
  slug: al-ghazali
  name: Abu Hamid al-Ghazali
  worldview: islam
  role: primary
  displayOrder: 4
  schools: [Ash'ari kalam, Sufism]
  era: c. 1056–1111
  deathYear: 1111
  description: Theologian, jurist and mystic whose critique of the philosophers and synthesis of kalam and Sufism were widely influential.
  bio: >-
    Abu Hamid Muhammad al-Ghazali was born in 1055 or 1056 at Tabaran-Tus in Khurasan and died
    in 1111. A Shafi'i jurist and Ash'ari theologian, he studied at Nishapur and in 1091 was
    appointed to the Nizamiyya madrasa in Baghdad. In 1095, after a personal crisis, he left
    his post, and he subsequently adopted the Sufi path, performing the pilgrimage in 1096.
    He taught again at the Nizamiyya in Nishapur from 1106, while also maintaining a private school and
    Sufi convent in Tus. His works include the Incoherence of the Philosophers (c. 1095) and
    the Revival of the Religious Sciences, a compendium of religious practice and ethics.
  significance: >-
    The Ihya' gives the fullest classical Sunni moral psychology of heart, self, desire, sin and repentance, which
    is why al-Ghazali is the main Islamic source on how one nature is both great and fallen. He also sets the
    Sunni relation between kalam, Sufism and philosophy.
  keyIdeas:
    - The heart (qalb) as a subtle, lordly reality and the true self
    - Four qualities within each person (brutish, predatory, demonic, lordly)
    - The heart as a mirror and sin as rust
    - Virtue as balance of faculties acquired by discipline (riyada)
    - Repentance as knowledge, remorse and action
    - Moral value known through revelation (Ash'ari)
  representativeWorks:
    - { title: "Ihya' 'Ulum al-Din, Book 21: The Marvels of the Heart", sourceId: ghazali-marvels-heart }
    - { title: "Ihya' 'Ulum al-Din, Books 22-23: On Disciplining the Soul and On Breaking the Two Desires", sourceId: ghazali-disciplining-soul }
    - { title: "Ihya' 'Ulum al-Din, Book 31: On Repentance", sourceId: ghazali-repentance-stern }
    - { title: Tahafut al-Falasifa, year: 1095 }
    - { title: al-Munqidh min al-Dalal }
  notes: Birth year corrected from the registry's 1058 to c. 1056 (SEP, from his own letters and autobiography); 1058-59 is a later historians' dating. Tahafut year is approximate.

