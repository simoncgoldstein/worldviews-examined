  notes: Dates-only correction. Death year corrected from the registry's 1209 to 1210 (606 AH; SEP).

- id: ibn-taymiyya
  slug: ibn-taymiyya
  name: Ibn Taymiyya
  worldview: islam
  role: primary
  displayOrder: 6
  schools: [Hanbali jurisprudence, Athari theology]
  birthYear: 1263
  deathYear: 1328
  description: Damascene jurist and theologian who argued from revelation against kalam and philosophical rationalism.
  bio: >-
    Taqi al-Din Ahmad ibn Taymiyya (1263-1328) was born in Harran, in what is now southeastern
    Turkey, and raised in Damascus after his family left in the face of the Mongol advance. A
    Hanbali jurist, he inherited his father's teaching post at the Sukkariyya madrasa in 1284.
    He issued influential legal opinions, wrote against Ash'ari and philosophical theology, Shi'i
    doctrine and some Sufi practices, and took part in public life in Syria. His positions led
    to repeated trials and several periods of imprisonment in Cairo, Alexandria and Damascus,
    and he died in the Damascus citadel in 1328.
  significance: >-
    Ibn Taymiyya offers the strongest account of the fitra, an innate disposition to know and worship God that
    includes moral intuitions, and of humans as beings who necessarily love and worship something. He is the main
    Athari alternative to Ash'ari and Maturidi kalam on human nature and agency.
  keyIdeas:
    - The fitra as innate disposition, perfected by prophecy
    - Humans necessarily love and worship something
    - God creates acts through human will and power
    - Divine acts have wise purposes
    - Revealed law as coextensive with justice and benefit
    - Revelation and sound reason do not truly conflict
  representativeWorks:
    - { title: al-'Aqida al-Wasitiyya }
    - { title: "Dar' Ta'arud al-'Aql wa-l-Naql (Averting the Conflict between Reason and Revealed Tradition)" }
    - { title: "al-Siyasa al-Shar'iyya (Law-Guided Public Policy)" }
  notes: Dar' Ta'arud was written after 1313 and al-Siyasa around 1310 (SEP). Wasitiyya date not verified.

- id: ibn-sina
  slug: avicenna-ibn-sina
  name: Avicenna (Ibn Sina)
  worldview: islam
  role: primary
  displayOrder: 3
  schools: [Islamic philosophy, Peripatetic tradition]
  birthYear: 980
  deathYear: 1037
  description: Philosopher and physician whose metaphysics of the Necessary Existent shaped later Islamic theology and philosophy.
  bio: >-
    Abu 'Ali al-Husayn ibn Sina (c. 980-1037) was born at Afshana near Bukhara and educated
    there. He worked as a physician and counsellor to rulers across Iran and Central Asia,
    served as a vizier at Hamadan, and spent his last years in Isfahan under the Kakuyid
    ruler 'Ala' al-Dawla, dying at Hamadan in 1037. In the Peripatetic tradition of falsafa, he
    developed a comprehensive philosophical system in the Book of Healing (al-Shifa'),
    completed around 1020, and the later Pointers and Reminders. His Canon of Medicine was a
    standard medical text for centuries. His metaphysics of the Necessary Existent and his
    psychology of the soul influenced Muslim, Jewish and Latin Christian thinkers.
  significance: >-
    Ibn Sina offers the philosophical account of human greatness as the perfection of the rational soul through
    knowledge, and of evil as privation. He represents falsafa, which is not identical with kalam: Ash'ari and
    other theologians accepted parts of his thought and rejected others.
  keyIdeas:
    - Immaterial rational soul
    - Internal senses, including estimation (wahm)
    - Happiness as the intellectual perfection of the soul
    - Prophecy as supremely developed intellect and imagination
    - Evil as privation in a world of generation and corruption
    - Necessary Existent and contingent beings
  representativeWorks:
    - { title: "The Book of Healing (al-Shifa')", year: 1020 }
    - { title: al-Najat }
    - { title: al-Isharat wa-l-Tanbihat }
    - { title: Canon of Medicine }
  notes: Birth year is conventionally given as c. 980 (370 AH). The Shifa' year is the approximate completion date. Islamic philosophy is not simply identical with orthodox kalam; entries should say which they represent.

- id: ibn-arabi
  slug: ibn-arabi
  name: Ibn Arabi
  worldview: islam
  role: specialist
  displayOrder: 1
  usedFor: [mystical theology, Sufi metaphysics]
  schools: [Sufism]
  birthYear: 1165
  deathYear: 1240
  description: Andalusian mystic and author of an influential Sufi metaphysics of divine self-disclosure.
  bio: >-
    Muhyi al-Din Ibn al-'Arabi (1165-1240) was born in Murcia in al-Andalus and educated in
    Seville. He left the Muslim West in 1200 and went to Mecca, where he began writing his
    vast work al-Futuhat al-Makkiyya around 1202. After travelling through Syria, Iraq and
    Anatolia, he settled in Damascus in 1223 and remained there until his death in 1240. In
    1229 he composed the shorter Fusus al-Hikam, which became the subject of more than a hundred
    commentaries. His writings on the divine names, the cosmos and the Perfect Human shaped later
    Sufism and Islamic philosophy.
  significance: >-
    Ibn Arabi gives the human as the comprehensive being able to realise every divine name, and hence every
    possibility, high and low. His views are contested within Sunni thought, so he serves as a specialist source for
    mystical theology and not as the default Islamic account.
  keyIdeas:
    - The human created in the form of the all-comprehensive name Allah
    - Deiformity (takhalluq bi-asma' Allah)
    - The Perfect Human (al-insan al-kamil)
    - Divine self-disclosure
    - Creative command versus prescriptive command
  representativeWorks:
    - { title: al-Futuhat al-Makkiyya, year: 1202 }
    - { title: Fusus al-Hikam, year: 1229 }
